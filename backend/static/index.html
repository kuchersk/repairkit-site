<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repairkit · Склад</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repairkit">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F1; --border:#DAD5CB;
    --text:#1C1A17; --muted:#6B655C; --accent:#C1651B; --accent-ink:#FFFFFF;
    --ok:#2F7A4F; --ok-bg:#E4F0E7; --bad:#B23A2E; --bad-bg:#FBE7E3;
    --warn-bg:#F6E9D7;
    --radius:14px; --radius-sm:8px;
    --shadow: 0 1px 2px rgba(28,26,23,.06), 0 6px 20px rgba(28,26,23,.05);
    font-size:16px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161A; --surface:#1E2127; --surface-2:#1A1D22; --border:#2B2F37;
      --text:#ECE9E3; --muted:#8B8F98; --accent:#E8A33D; --accent-ink:#191204;
      --ok:#4FAE7A; --ok-bg:#173026; --bad:#E2635B; --bad-bg:#341B1A;
      --warn-bg:#332A18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161A; --surface:#1E2127; --surface-2:#1A1D22; --border:#2B2F37;
    --text:#ECE9E3; --muted:#8B8F98; --accent:#E8A33D; --accent-ink:#191204;
    --ok:#4FAE7A; --ok-bg:#173026; --bad:#E2635B; --bad-bg:#341B1A;
    --warn-bg:#332A18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  html,body{height:100%;}
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code, .mono, input.mono, .stat-num, .barcode-text { font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }

  .shell{ max-width:760px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  header.top{
    padding:18px 18px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
  }
  header.top h1{ font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em; }
  header.top h1 span{ color:var(--accent); }
  header.top .sub{ font-size:12px; color:var(--muted); }

  main{ flex:1; padding:16px 16px 96px; display:flex; flex-direction:column; gap:16px; }

  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; bottom:env(safe-area-inset-bottom,0px);
    display:flex; justify-content:center; z-index:10;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  nav.tabs .bar{
    display:flex; gap:2px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:4px; box-shadow:var(--shadow); max-width:760px; width:100%;
  }
  nav.tabs button{
    flex:1; border:none; background:transparent; color:var(--muted); font:inherit;
    font-weight:600; font-size:12.5px; padding:9px 4px; border-radius:12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabs button .ic{ font-size:17px; line-height:1; }
  nav.tabs button.active{ background:var(--accent); color:var(--accent-ink); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .card h2{ margin:0 0 12px; font-size:15px; font-weight:700; }
  .row{ display:flex; gap:10px; align-items:center; }
  .col{ display:flex; flex-direction:column; gap:8px; }
  .grow{ flex:1; }
  .muted{ color:var(--muted); font-size:13px; }
  .small{ font-size:12.5px; }

  input[type=text], input[type=number], input[type=search], select{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--text); font:inherit; font-size:15px;
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  label{ font-size:12.5px; font-weight:600; color:var(--muted); }

  button.btn{
    border:none; border-radius:var(--radius-sm); padding:11px 16px; font:inherit; font-weight:700;
    font-size:14px; cursor:pointer; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  }
  button.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.btn.ok{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  button.btn.bad{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  button.btn:disabled{ opacity:.45; cursor:not-allowed; }
  button.btn.big{ font-size:16px; padding:14px 18px; }
  button.icon-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:10px; width:44px; height:44px; font-size:18px; cursor:pointer; }

  .scan-input-wrap{ position:relative; }
  #scanInput{ font-size:20px; padding:16px 52px 16px 14px; font-family:'JetBrains Mono',monospace; letter-spacing:.02em; }
  .scan-cam-btn{ position:absolute; right:6px; top:6px; bottom:6px; width:40px; border-radius:8px; border:none; background:transparent; font-size:20px; cursor:pointer; color:var(--muted); }

  .result-empty{ padding:30px 10px; text-align:center; color:var(--muted); }
  .result-empty .big-ic{ font-size:34px; display:block; margin-bottom:8px; }

  .item-card .name{ font-size:16px; font-weight:700; line-height:1.3; margin-bottom:6px; }
  .item-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:14px; }
  .item-meta .m{ font-size:12.5px; color:var(--muted); }
  .item-meta .m b{ color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:600; }
  .stock-pill{ display:inline-flex; align-items:baseline; gap:6px; padding:8px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:16px; }
  .stock-pill .num{ font-size:22px; font-weight:800; font-family:'JetBrains Mono',monospace; }
  .stock-pill.zero{ background:var(--warn-bg); }

  .qty-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .qty-row input{ width:70px; text-align:center; flex:0 0 70px; }
  .action-row{ display:flex; gap:10px; }
  .action-row .btn{ flex:1; padding:14px; font-size:15px; }

  .not-found-box{ text-align:center; padding:10px 4px 4px; }
  .not-found-box .big-ic{ font-size:32px; }
  .flash{ animation:flashok .6s ease; }
  @keyframes flashok{ 0%{ background:var(--ok-bg); } 100%{ background:var(--surface); } }

  table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.data th{ text-align:left; font-size:11.5px; color:var(--muted); text-transform:none; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  table.data td{ padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.data tr:last-child td{ border-bottom:none; }
  .tbl-scroll{ max-height:420px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .tbl-scroll.short{ max-height:220px; }
  .num-cell{ font-family:'JetBrains Mono',monospace; text-align:right; white-space:nowrap; }
  .zero-cell{ color:var(--bad); }

  .stats-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .stat{ flex:1; min-width:100px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; }
  .stat .lbl{ font-size:11px; color:var(--muted); margin-bottom:3px; }
  .stat .stat-num{ font-size:19px; font-weight:700; }

  details.batch{ border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; }
  details.batch summary{ padding:11px 12px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:8px; align-items:center; background:var(--surface-2); }
  details.batch summary::-webkit-details-marker{ display:none; }
  .tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--accent); color:var(--accent-ink); }
  .batch-body{ padding:10px 12px; }

  .step-wizard .step{ border-top:1px dashed var(--border); padding-top:14px; margin-top:14px; }
  .step-wizard .step:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .step-num{ display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:800; align-items:center; justify-content:center; margin-right:6px; }

  .preview-row.picked{ outline:2px solid var(--accent); outline-offset:-2px; background:var(--ok-bg) !important; }
  .preview-row{ cursor:pointer; }
  .preview-row:hover{ background:var(--surface-2); }

  .banner{ padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:2px; }
  .banner.info{ background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
  .banner.ok{ background:var(--ok-bg); color:var(--ok); }
  .banner.bad{ background:var(--bad-bg); color:var(--bad); }
  .banner.warn{ background:var(--warn-bg); color:var(--text); }

  .cam-overlay{ position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column; }
  .cam-overlay video{ flex:1; object-fit:cover; width:100%; }
  .cam-overlay .cam-close{ position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:rgba(0,0,0,.55); color:#fff; border:none; width:40px; height:40px; border-radius:50%; font-size:18px; z-index:2; }
  .cam-overlay .cam-hint{ position:absolute; bottom:calc(30px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  .cam-overlay .cam-frame{ position:absolute; top:50%; left:50%; width:78%; max-width:340px; height:110px; transform:translate(-50%,-50%); border:2px solid var(--accent); border-radius:12px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); }

  .checkbox-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-check{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 8px; font-size:12.5px; cursor:pointer; }
  .chip-check input{ width:auto; accent-color:var(--accent); }

  a.link-btn{ text-decoration:none; }
  ::placeholder{ color: color-mix(in srgb, var(--muted) 80%, transparent); }

  .radio-line{ display:flex; gap:16px; }
  .radio-line label{ display:flex; align-items:center; gap:6px; font-weight:500; color:var(--text); font-size:13.5px; }
  .radio-line input{ width:auto; accent-color:var(--accent); }

  .empty-state{ text-align:center; padding:28px 10px; color:var(--muted); }
  .empty-state .big-ic{ font-size:30px; display:block; margin-bottom:8px; }

  @media (min-width:600px){
    .action-row .btn{ font-size:16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div>
      <h1>Repairkit <span>· Склад</span></h1>
      <div class="sub" id="connStatus">Подключение…</div>
    </div>
    <div class="sub" id="itemsCountBadge"></div>
    <button onclick="window.__setApiKey()" style="border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;" title="Ключ доступа">⚙</button>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <div class="bar" id="tabBar">
      <button data-tab="scan" class="active"><span class="ic">🔦</span>Скан</button>
      <button data-tab="nomen"><span class="ic">📋</span>Номенклатура</button>
      <button data-tab="stock"><span class="ic">📥</span>Остатки</button>
      <button data-tab="orders"><span class="ic">🧾</span>Заказы</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  
  var items = new Map();        // sku -> {sku,article,name,barcode,stock,updatedAt}
  var barcodeIndex = new Map(); // normalized barcode -> sku
  var orderBatches = new Map(); // id -> {marketplace,fileName,uploadedAt,columns,rows,partOf,partIndex,partsTotal}
  var recentScans = [];         // client-side only, most recent first
  var currentTab = "scan";
  var camStream = null;

  var els = { main: document.getElementById('main'), status: document.getElementById('connStatus'), badge: document.getElementById('itemsCountBadge') };

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function fmtInt(n){ n = Number(n)||0; return n.toLocaleString('ru-RU'); }
  function esc(s){ return (s==null?'':String(s)); }
  function normBarcode(s){ return String(s==null?'':s).trim().toUpperCase(); }
  function splitBarcodes(raw){
    if (raw == null) return [];
    return String(raw).split(/[,;]/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function nowIso(){ return new Date().toISOString(); }
  function safeId(s){ var v = String(s==null?'':s).trim().replace(/[^A-Za-z0-9_.~:@+-]/g,'-').slice(0,180); return v || ('X'+Date.now()); }
  function toast(msg, kind){
    var t = el('div', {class:'banner ' + (kind||'info'), style:'position:fixed;left:16px;right:16px;bottom:96px;z-index:40;box-shadow:var(--shadow);'}, [msg]);
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);
  }

  /* ---------------- API client ---------------- */
  var apiKey = localStorage.getItem('repairkit_api_key') || '';

  function apiHeaders(withJson){
    var h = {};
    if (withJson) h['Content-Type'] = 'application/json';
    if (apiKey) h['X-API-Key'] = apiKey;
    return h;
  }
  async function apiFetch(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, apiHeaders(!!opts.body), opts.headers || {});
    var res = await fetch(path, opts);
    if (!res.ok){
      var text = '';
      try{ text = await res.text(); }catch(e){}
      throw new Error('HTTP ' + res.status + ' ' + text);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function setApiKey(){
    var v = prompt('Ключ доступа к серверу (оставьте пустым, если сервер без ключа):', apiKey);
    if (v === null) return;
    apiKey = v.trim();
    localStorage.setItem('repairkit_api_key', apiKey);
    initApp();
  }
  window.__setApiKey = setApiKey;

  /* ---------------- app init ---------------- */
  async function initApp(){
    els.status.textContent = 'Загрузка…';
    await refreshItems();
    refreshOrders();
    setInterval(refreshItems, 15000);
    setInterval(function(){ if (currentTab === 'orders') refreshOrders(); }, 20000);
  }

  function indexItem(it){
    items.set(it.sku, it);
    splitBarcodes(it.barcodeOzn).concat(splitBarcodes(it.barcode2)).forEach(function(b){ barcodeIndex.set(normBarcode(b), it.sku); });
  }

  async function refreshItems(){
    try{
      var list = await apiFetch('/api/items');
      items = new Map();
      barcodeIndex = new Map();
      list.forEach(indexItem);
      els.status.textContent = items.size ? 'Синхронизировано' : 'База пуста — загрузите номенклатуру';
      els.badge.textContent = items.size ? (fmtInt(items.size) + ' позиций') : '';
      render();
    }catch(e){
      els.status.textContent = 'Нет соединения с сервером';
    }
  }

  async function refreshOrders(){
    try{
      var list = await apiFetch('/api/orders');
      orderBatches = new Map();
      list.forEach(function(b){ orderBatches.set(b.id, b); });
      if (currentTab === 'orders') render();
    }catch(e){}
  }

  /* ---------------- render dispatch ---------------- */
  function render(){
    if (currentTab === 'scan') renderScan();
    else if (currentTab === 'nomen') renderNomen();
    else if (currentTab === 'stock') renderStock();
    else if (currentTab === 'orders') renderOrders();
  }

  document.getElementById('tabBar').addEventListener('click', function(e){
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    currentTab = b.getAttribute('data-tab');
    Array.prototype.forEach.call(document.querySelectorAll('#tabBar button'), function(x){ x.classList.toggle('active', x===b); });
    render();
  });

  /* ================= SCAN TAB ================= */
  var scanState = { found:null, notFoundCode:null, qty:1 };

  function renderScan(){
    els.main.innerHTML = '';
    var wrap = el('div', {class:'col'});

    var inputCard = el('div', {class:'card'});
    inputCard.appendChild(el('h2', {}, ['Сканировать штрихкод']));
    var iw = el('div', {class:'scan-input-wrap'});
    var input = el('input', {type:'text', id:'scanInput', class:'mono', placeholder:'Наведите сканер или введите код…', autocomplete:'off'});
    iw.appendChild(input);
    if ('BarcodeDetector' in window){
      iw.appendChild(el('button', {class:'scan-cam-btn', title:'Сканировать камерой', onclick:openCamera}, ['📷']));
    }
    inputCard.appendChild(iw);
    inputCard.appendChild(el('div', {class:'muted small', style:'margin-top:8px;'}, ['Работает с USB/Bluetooth-сканером (просто наведите курсор в поле) или введите код вручную и нажмите Enter.']));
    wrap.appendChild(inputCard);

    var resultCard = el('div', {class:'card item-card'});
    if (!items.size){
      resultCard.appendChild(el('div', {class:'empty-state'}, [el('span',{class:'big-ic'},['📦']), 'База номенклатуры пуста.', el('br'), 'Загрузите файл на вкладке «Номенклатура».']));
    } else if (scanState.found){
      resultCard.appendChild(renderFoundCard(scanState.found));
    } else if (scanState.notFoundCode){
      resultCard.appendChild(renderNotFoundCard(scanState.notFoundCode));
    } else {
      resultCard.appendChild(el('div', {class:'result-empty'}, [el('span',{class:'big-ic'},['🔦']), 'Отсканируйте товар — карточка появится здесь']));
    }
    wrap.appendChild(resultCard);

    if (recentScans.length){
      var histCard = el('div', {class:'card'});
      histCard.appendChild(el('h2', {}, ['Последние сканы']));
      var list = el('div', {class:'col'});
      recentScans.slice(0,8).forEach(function(h){
        list.appendChild(el('div', {class:'row', style:'font-size:13px;justify-content:space-between;'}, [
          el('span', {}, [h.name || h.barcode]),
          el('span', {class: (h.delta>0?'ok':'bad'), style:'font-family:JetBrains Mono,monospace;font-weight:700;color:var(--' + (h.delta>0?'ok':'bad') + ');'}, [(h.delta>0?'+':'') + h.delta])
        ]));
      });
      histCard.appendChild(list);
      wrap.appendChild(histCard);
    }

    els.main.appendChild(wrap);

    var scanInputEl = document.getElementById('scanInput');
    scanInputEl.focus();
    scanInputEl.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        e.preventDefault();
        handleScan(scanInputEl.value);
        scanInputEl.value = '';
      }
    });
  }

  function renderFoundCard(item){
    var box = el('div', {});
    box.appendChild(el('div', {class:'name'}, [item.name || '(без названия)']));
    box.appendChild(el('div', {class:'item-meta'}, [
      el('span', {class:'m'}, ['SKU: ', el('b',{},[item.sku])]),
      el('span', {class:'m'}, ['Артикул: ', el('b',{},[item.article||'—'])]),
      el('span', {class:'m'}, ['ШК OZN: ', el('b',{},[item.barcodeOzn||'—'])]),
      el('span', {class:'m'}, ['ШК 2...: ', el('b',{},[item.barcode2||'—'])])
    ]));
    box.appendChild(el('div', {class:'stock-pill' + (item.stock<=0?' zero':'')}, [
      el('span', {class:'num'}, [fmtInt(item.stock)]), el('span',{class:'muted small'},['на остатке'])
    ]));
    var qtyRow = el('div', {class:'qty-row'});
    var qtyInput = el('input', {type:'number', min:'1', value:String(scanState.qty), id:'qtyInput'});
    qtyInput.addEventListener('input', function(){ scanState.qty = Math.max(1, parseInt(this.value)||1); });

  async function handleScan(raw){
    var code = normBarcode(raw);
    if (!code) return;
    var sku = barcodeIndex.get(code);
    if (sku && items.has(sku)){
      scanState.found = items.get(sku);
      scanState.notFoundCode = null;
    } else {
      scanState.found = null;
      scanState.notFoundCode = code;
    }
    scanState.qty = 1;
    render();
  }

  async function applyDelta(sku, delta){
    try{
      var it = await apiFetch('/api/items/' + encodeURIComponent(sku) + '/stock', { method:'POST', body: JSON.stringify({ delta: delta }) });
      indexItem(it);
      recentScans.unshift({ name: it.name, barcode: it.barcodeOzn || it.barcode2 || '', delta: delta });
      recentScans = recentScans.slice(0, 20);
      toast((delta>0?'Принято +':'Списано ') + Math.abs(delta) + ' · ' + (it.name||sku), 'ok');
      scanState.found = null; scanState.notFoundCode = null;
      render();
    }catch(e){
      toast('Не удалось обновить остаток', 'bad');

  }

  async function createNewItem(code){

    try{

  /* ---- camera scanning ---- */
  async function openCamera(){
    var overlay = el('div', {class:'cam-overlay'});
    var video = el('video', {autoplay:'', muted:'', playsinline:''});
    overlay.appendChild(video);
    overlay.appendChild(el('div', {class:'cam-frame'}));
    overlay.appendChild(el('div', {class:'cam-hint'}, ['Наведите камеру на штрихкод']));
    overlay.appendChild(el('button', {class:'cam-close', onclick:closeCamera}, ['✕']));
    document.body.appendChild(overlay);
    try{
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      video.srcObject = camStream;
      var detector = new window.BarcodeDetector({ formats:['ean_13','ean_8','code_128','upc_a','upc_e','code_39'] });
      var stopped = false;
      overlay._stop = function(){ stopped = true; };
      (async function loop(){
        while(!stopped){
          try{
            var codes = await detector.detect(video);
            if (codes && codes.length){
              var val = codes[0].rawValue;
              closeCamera();
              document.getElementById('scanInput').value = val;
              handleScan(val);
              return;
            }
          }catch(e){}
          await new Promise(function(r){ setTimeout(r, 220); });
        }
      })();
    }catch(e){
      toast('Нет доступа к камере', 'bad');
      closeCamera();
    }
    function closeCamera(){
      if (overlay._stop) overlay._stop();
      if (camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
      overlay.remove();
    }
  }

  async function applyNomenUpload(mapping, dataRows){
    var toWrite = [];
    dataRows.forEach(function(row){
      var article = mapping.article!=null ? row[mapping.article] : null;
      var sku = mapping.sku!=null ? row[mapping.sku] : null;
      var name = mapping.name!=null ? row[mapping.name] : null;
      var rawParts = [];
      if (mapping.barcodeOzn!=null) rawParts.push(row[mapping.barcodeOzn]);
      if (mapping.barcode2!=null && mapping.barcode2!==mapping.barcodeOzn) rawParts.push(row[mapping.barcode2]);
      var tokens = [];
      rawParts.forEach(function(p){ tokens = tokens.concat(splitBarcodes(p)); });
      var ozn = tokens.find(function(t){ return t.toUpperCase().indexOf('OZN')===0; }) || '';
      var b2 = tokens.find(function(t){ return t.toUpperCase().indexOf('OZN')!==0; }) || '';
      if (sku==null && !ozn && !b2) return;
      var skuStr = safeId(sku!=null ? String(sku).trim() : ('BC-' + (ozn||b2)));
      if (!skuStr) return;
      toWrite.push({ sku: skuStr, article: article!=null?String(article).trim():'', name: name!=null?String(name).trim():'', barcodeOzn: ozn, barcode2: b2 });
    });
    var done=0, created=0, updated=0;
    for (var i=0;i<toWrite.length;i++){
      var r = toWrite[i];
      var existed = items.has(r.sku);
      try{
        var it = await apiFetch('/api/items/' + encodeURIComponent(r.sku), { method:'PUT', body: JSON.stringify({ article:r.article, name:r.name, barcodeOzn:r.barcodeOzn, barcode2:r.barcode2, stock:0 }) });
        indexItem(it);
        if (existed) updated++; else created++;
      }catch(e){}
      done++;
      if (done % 20 === 0) updateWizardProgress(done, toWrite.length);
    }
    updateWizardProgress(done, toWrite.length, true);
    toast('Номенклатура обновлена: ' + updated + ' обновлено, ' + created + ' создано', 'ok');
  }

  async function applyStockUpload(mapping, dataRows, mode){
    if (mapping.barcode==null || mapping.qty==null){ toast('Выберите столбцы штрихкода и количества', 'bad'); return; }
    var perSku = new Map(); // sku -> summed qty
    var notFound = [];
    dataRows.forEach(function(row){
      var rawBc = row[mapping.barcode];
      var rawQty = row[mapping.qty];
      if (rawBc==null) return;
      var qty = parseFloat(String(rawQty==null?'0':rawQty).replace(',','.')) || 0;
      var tokens = splitBarcodes(rawBc);
      var matchedSku = null;
      for (var t=0;t<tokens.length;t++){
        var sku = barcodeIndex.get(normBarcode(tokens[t]));
        if (sku){ matchedSku = sku; break; }
      }
      if (matchedSku){
        perSku.set(matchedSku, (perSku.get(matchedSku)||0) + qty);
      } else {
        notFound.push({ barcode: tokens.join('; '), qty: qty });
      }
    });
    var done=0, total=perSku.size;
    var skus = Array.from(perSku.keys());
    for (var i=0;i<skus.length;i++){
      var sku = skus[i];
      var addQty = perSku.get(sku);
      try{
        var body = mode === 'replace' ? { stock: Math.max(0, addQty) } : { delta: addQty };
        var it = await apiFetch('/api/items/' + encodeURIComponent(sku) + '/stock', { method:'POST', body: JSON.stringify(body) });
        indexItem(it);
      }catch(e){}
      done++;
      if (done % 15 === 0) updateWizardProgress(done, total);
    }
    updateWizardProgress(done, total, true);
    renderStockResult(document.getElementById('stockUploadWizard'), total, notFound);
  }

    var batches = Array.from(orderBatches.values());
    var mpSet = Array.from(new Set(batches.map(function(b){ return b.marketplace; }))).filter(Boolean);
    var totalRows = batches.reduce(function(a,b){ return a + (b.rows?b.rows.length:0); }, 0);
    var stats = el('div', {class:'stats-row'}, [
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Загрузок']), el('div',{class:'stat-num'},[fmtInt(batches.length)])]),
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Строк заказов']), el('div',{class:'stat-num'},[fmtInt(totalRows)])]),
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Маркетплейсов']), el('div',{class:'stat-num'},[fmtInt(mpSet.length)])])
    ]);
    wrap.appendChild(stats);

    var listCard = el('div', {class:'card'});
    listCard.appendChild(el('h2', {}, ['Загруженные заказы']));
    if (mpSet.length>1){
      var filterSel = el('select', {style:'margin-bottom:10px;'});
      filterSel.appendChild(el('option', {value:''}, ['Все маркетплейсы']));
      mpSet.forEach(function(m){ filterSel.appendChild(el('option', {value:m, selected: m===ordersFilterMp?'selected':null}, [m])); });
      filterSel.addEventListener('change', function(){ ordersFilterMp = this.value; renderOrders(); });
      listCard.appendChild(filterSel);
    }
    var visible = batches.filter(function(b){ return !ordersFilterMp || b.marketplace===ordersFilterMp; })
                          .sort(function(a,b){ return (b.uploadedAt||'').localeCompare(a.uploadedAt||''); });
    if (!visible.length){
      listCard.appendChild(el('div', {class:'empty-state'}, [el('span',{class:'big-ic'},['🧾']), 'Заказы ещё не загружены']));
    } else {
      visible.forEach(function(b){ listCard.appendChild(renderBatchDetails(b)); });
    }
    wrap.appendChild(listCard);
    els.main.appendChild(wrap);
  }

  function renderBatchDetails(b){
    var d = el('details', {class:'batch'});
    var dateStr = b.uploadedAt ? new Date(b.uploadedAt).toLocaleString('ru-RU') : '';
    d.appendChild(el('summary', {}, [
      el('span', {}, [el('span',{class:'tag'},[b.marketplace||'—']), ' ', el('b',{},[b.fileName||'']) ]),
      el('span', {class:'muted small'}, [(b.rows?b.rows.length:0) + ' стр · ' + dateStr])
    ]));
    var body = el('div', {class:'batch-body'});
    var cols = b.columns || (b.rows && b.rows[0] ? Object.keys(b.rows[0]) : []);
    var tblWrap = el('div', {class:'tbl-scroll short'});
    var table = el('table', {class:'data'});
    table.appendChild(el('thead', {}, [el('tr', {}, cols.map(function(c){ return el('th',{},[c]); }))]));
    var tbody = el('tbody');
    (b.rows||[]).slice(0,100).forEach(function(r){
      tbody.appendChild(el('tr', {}, cols.map(function(c){ return el('td', {}, [r[c]==null?'':String(r[c])]); })));
    });
    table.appendChild(tbody); tblWrap.appendChild(table);
    body.appendChild(tblWrap);
    if ((b.rows||[]).length>100) body.appendChild(el('div', {class:'muted small', style:'padding:6px 2px;'}, ['Показаны первые 100 из ' + b.rows.length]));
    body.appendChild(el('button', {class:'btn bad small', style:'margin-top:8px;', onclick:function(){ deleteBatch(b.id); }}, ['Удалить загрузку']));
    d.appendChild(body);
    return d;
  }

  async function deleteBatch(id){
    try{ await apiFetch('/api/orders/' + encodeURIComponent(id), { method:'DELETE' }); toast('Загрузка удалена', 'ok'); refreshOrders(); }
    catch(e){ toast('Не удалось удалить', 'bad'); }
  }

  function startOrdersUpload(file, marketplace, fileName){
    readWorkbook(file, function(wb, sheetNames){
      renderUploadWizard(document.getElementById('ordersUploadWizard'), wb, sheetNames, {
        columnKeepMode: true,
        onApply: function(keptCols, dataRows){
          applyOrdersUpload(marketplace, fileName, keptCols, dataRows);
        }
      });
    });
  }

  async function applyOrdersUpload(marketplace, fileName, keptCols, dataRows){
    var rows = dataRows.map(function(row){
      var o = {};
      keptCols.forEach(function(c){ o[c] = row[c]==null?'':row[c]; });
      return o;
    }).filter(function(o){ return Object.values(o).some(function(v){ return v!==''; }); });
    try{
      var res = await apiFetch('/api/orders', { method:'POST', body: JSON.stringify({ marketplace: marketplace, fileName: fileName, columns: keptCols, rows: rows }) });
      toast('Заказы сохранены: ' + res.rowCount + ' строк', 'ok');
      document.getElementById('ordersUploadWizard').innerHTML = '';
      refreshOrders();
    }catch(e){ toast('Ошибка сохранения заказов', 'bad'); }
  }

  /* ================= generic upload wizard (shared) ================= */
  function readWorkbook(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        cb(wb, wb.SheetNames);
      }catch(err){ toast('Не удалось прочитать файл', 'bad'); }
    };
    reader.readAsArrayBuffer(file);
  }

  function guessHeaderRow(rows){
    var bestIdx = 0, bestScore = -1;
    for (var i=0;i<Math.min(rows.length,15);i++){
      var r = rows[i]||[];
      var score = r.filter(function(c){ return typeof c === 'string' && c.trim().length>0; }).length;
      if (score > bestScore){ bestScore = score; bestIdx = i; }
    }
    return bestIdx;
  }

  function renderUploadWizard(container, wb, sheetNames, opts){
    container.innerHTML = '';
    var state = { sheet: sheetNames[0], headerRow: 0, rows: [] };

    function loadSheet(){
      var ws = wb.Sheets[state.sheet];
      state.rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      state.headerRow = guessHeaderRow(state.rows);
      renderAll();
    }

    function renderAll(){
      container.innerHTML = '';
      var wiz = el('div', {class:'step-wizard'});

      if (sheetNames.length>1){
        var s1 = el('div', {class:'step'});
        s1.appendChild(el('div', {}, [el('span',{class:'step-num'},['1']), 'Лист файла']));
        var sel = el('select', {style:'margin-top:8px;'});
        sheetNames.forEach(function(n){ sel.appendChild(el('option', {value:n, selected: n===state.sheet?'selected':null}, [n])); });
        sel.addEventListener('change', function(){ state.sheet = this.value; loadSheet(); });
        s1.appendChild(sel);
        wiz.appendChild(s1);
      }

      var s2 = el('div', {class:'step'});
      s2.appendChild(el('div', {}, [el('span',{class:'step-num'},[sheetNames.length>1?'2':'1']), 'Укажите строку с заголовками (кликните по строке)']));
      var prevWrap = el('div', {class:'tbl-scroll short', style:'margin-top:8px;'});
      var prevTable = el('table', {class:'data'});
      var prevBody = el('tbody');
      state.rows.slice(0,15).forEach(function(r, idx){
        var tr = el('tr', {class:'preview-row' + (idx===state.headerRow?' picked':''), onclick:function(){ state.headerRow = idx; renderAll(); }});
        tr.appendChild(el('td', {class:'mono muted', style:'width:26px;'}, [String(idx+1)]));
        (r||[]).slice(0,8).forEach(function(c){ tr.appendChild(el('td', {}, [c==null?'':String(c)])); });
        prevBody.appendChild(tr);
      });
      prevTable.appendChild(prevBody);
      prevWrap.appendChild(prevTable);
      s2.appendChild(prevWrap);
      wiz.appendChild(s2);

      var headerRowVals = (state.rows[state.headerRow]||[]).map(function(c,i){ return c==null || String(c).trim()==='' ? ('Столбец '+(i+1)) : String(c).trim(); });
      var dataRowsRaw = state.rows.slice(state.headerRow+1).filter(function(r){ return r && r.some(function(c){ return c!=null && String(c).trim()!==''; }); });
      var dataRowObjs = dataRowsRaw.map(function(r){ var o={}; headerRowVals.forEach(function(h,i){ o[h]=r[i]!=null?r[i]:null; }); return o; });

      var s3 = el('div', {class:'step'});
      var stepN = sheetNames.length>1 ? '3' : '2';

      if (opts.columnKeepMode){
        s3.appendChild(el('div', {}, [el('span',{class:'step-num'},[stepN]), 'Какие столбцы сохранить']));
        var chipsWrap = el('div', {class:'checkbox-list', style:'margin-top:8px;'});
        var checks = {};
        headerRowVals.forEach(function(h){
          var cb = el('input', {type:'checkbox', checked:'checked'});
          checks[h] = cb;
          chipsWrap.appendChild(el('label', {class:'chip-check'}, [cb, h]));
        });
        s3.appendChild(chipsWrap);
        wiz.appendChild(s3);

        var s4 = el('div', {class:'step'});
        s4.appendChild(el('div', {}, [el('span',{class:'step-num'},[String(Number(stepN)+1)]), fmtInt(dataRowObjs.length) + ' строк готовы к сохранению']));
        s4.appendChild(el('button', {class:'btn primary big', style:'width:100%;margin-top:10px;', onclick:function(){
          var kept = headerRowVals.filter(function(h){ return checks[h].checked; });
          opts.onApply(kept, dataRowObjs);
        }}, ['Сохранить заказы']));
        wiz.appendChild(s4);
      } else {
        s3.appendChild(el('div', {}, [el('span',{class:'step-num'},[stepN]), 'Сопоставьте столбцы']));
        var mapping = {};
        var grid = el('div', {class:'col', style:'margin-top:8px;'});
        opts.fields.forEach(function(f){
          var row = el('div', {});
          row.appendChild(el('label', {}, [f.label]));
          var sel = el('select', {style:'margin-top:4px;'});
          sel.appendChild(el('option', {value:''}, ['— не использовать —']));
          headerRowVals.forEach(function(h){ sel.appendChild(el('option', {value:h}, [h])); });
          var guessMatch = headerRowVals.find(function(h){ return f.guess.some(function(g){ return h.toLowerCase().indexOf(g)>=0; }); });
          if (guessMatch) sel.value = guessMatch;
          mapping[f.key] = sel.value || null;
          sel.addEventListener('change', function(key, selEl){ return function(){ mapping[key] = selEl.value || null; }; }(f.key, sel));
          row.appendChild(sel);
          grid.appendChild(row);
        });
        s3.appendChild(grid);
        wiz.appendChild(s3);

        if (opts.extraControl){
          var s4b = el('div', {class:'step'});
          opts.extraControl(s4b);
          wiz.appendChild(s4b);
        }

        var s5 = el('div', {class:'step'});
        s5.appendChild(el('div', {}, [fmtInt(dataRowObjs.length) + ' строк будет обработано']));
        s5.appendChild(el('div', {id:'wizProgress', class:'muted small', style:'margin:6px 0;'}));
        s5.appendChild(el('button', {class:'btn primary big', style:'width:100%;margin-top:6px;', onclick:function(){
          opts.onApply(mapping, dataRowObjs);
        }}, ['Применить']));
        wiz.appendChild(s5);
      }

      container.appendChild(wiz);
    }

    loadSheet();
  }

  function updateWizardProgress(done, total, finished){
    var p = document.getElementById('wizProgress');
    if (!p) return;
    p.textContent = finished ? ('Готово: ' + fmtInt(done) + ' из ' + fmtInt(total)) : ('Обработано ' + fmtInt(done) + ' из ' + fmtInt(total) + '…');
  }

  /* ---------------- boot ---------------- */
  render();
  initApp();
})();
</script>
</body>
</html>
