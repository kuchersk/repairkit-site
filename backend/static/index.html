<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repairkit · Склад · Иваново</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repairkit">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F1EC; --surface:#FFFFFF; --surface-2:#F8F6F1; --border:#DAD5CB;
    --text:#1C1A17; --muted:#6B655C; --accent:#C1651B; --accent-ink:#FFFFFF;
    --ok:#2F7A4F; --ok-bg:#E4F0E7; --bad:#B23A2E; --bad-bg:#FBE7E3;
    --warn-bg:#F6E9D7;
    --radius:14px; --radius-sm:8px;
    --shadow: 0 1px 2px rgba(28,26,23,.06), 0 6px 20px rgba(28,26,23,.05);
    font-size:16px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161A; --surface:#1E2127; --surface-2:#1A1D22; --border:#2B2F37;
      --text:#ECE9E3; --muted:#8B8F98; --accent:#E8A33D; --accent-ink:#191204;
      --ok:#4FAE7A; --ok-bg:#173026; --bad:#E2635B; --bad-bg:#341B1A;
      --warn-bg:#332A18;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161A; --surface:#1E2127; --surface-2:#1A1D22; --border:#2B2F37;
    --text:#ECE9E3; --muted:#8B8F98; --accent:#E8A33D; --accent-ink:#191204;
    --ok:#4FAE7A; --ok-bg:#173026; --bad:#E2635B; --bad-bg:#341B1A;
    --warn-bg:#332A18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  }
  html,body{height:100%; overscroll-behavior-y: contain;}
  .loc-box{ border:1px dashed var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:14px; background:var(--surface-2); }
  .loc-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .loc-label{ font-size:12.5px; font-weight:600; color:var(--muted); }
  .loc-badge{ background:var(--accent); color:var(--accent-ink); font-weight:800; font-size:18px; padding:4px 12px; border-radius:8px; letter-spacing:.02em; }
  .loc-row{ display:flex; gap:8px; }
  .loc-row input{ flex:1; }
  .loc-cell{ cursor:pointer; white-space:nowrap; }
  .loc-cell:hover{ background:var(--surface-2); }
  .loc-empty{ color:var(--muted); }
  .loc-list-row{ display:flex; justify-content:space-between; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); cursor:pointer; }
  .loc-list-row:last-child{ border-bottom:none; }
  .loc-list-row:hover{ background:var(--surface-2); }
  .big-input{ font-size:20px; padding:16px 14px; letter-spacing:.02em; }
  .ship-line{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:11px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px; background:var(--surface-2); }
  .ship-line.done{ border-color:var(--ok); background:var(--ok-bg); }
  .ship-line.over{ border-color:var(--bad); background:var(--bad-bg); }
  .ship-main{ flex:1; min-width:0; }
  .ship-name{ font-weight:700; font-size:14px; line-height:1.3; }
  .ship-meta{ display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center; margin-top:4px; }
  .ship-qty{ display:flex; align-items:center; gap:8px; }
  .ship-count{ font-weight:800; font-size:17px; min-width:52px; text-align:center; }
  .big-money{ font-size:24px; font-weight:800; }
  .neg{ color:var(--bad); }
  tr.struck td{ text-decoration:line-through; opacity:.55; }
  .loc-badge.small{ font-size:13px; padding:2px 8px; }
  .sum-table td{ padding:9px 8px; }
  .pack-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .pack-row .stepper{ display:flex; align-items:center; gap:6px; }
  .pack-row input{ width:56px; text-align:center; }
  .founder-photo{ display:none; }
  /* The site stays centred; the photo sits in the free space on the left and never pushes the content.
     Its width follows the free space (760px = content column), and it disappears when there is not enough room. */
  @media (min-width: 1100px){
    .founder-photo{
      display:block; position:fixed; left:24px; bottom:0;
      width:clamp(120px, calc((100vw - 760px) / 2 - 48px), 220px); height:auto; max-height:82vh;
      object-fit:contain; object-position:bottom;
      z-index:1; pointer-events:none;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.35));
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  code, .mono, input.mono, .stat-num, .barcode-text { font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }

  .shell{ max-width:760px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; }

  header.top{
    padding:18px 18px 14px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5;
  }
  header.top h1{ font-size:19px; font-weight:800; margin:0; letter-spacing:-.01em; }
  header.top h1 span{ color:var(--accent); }
  header.top .sub{ font-size:12px; color:var(--muted); }

  main{ flex:1; padding:16px 16px 96px; display:flex; flex-direction:column; gap:16px; }

  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; bottom:env(safe-area-inset-bottom,0px);
    display:flex; justify-content:center; z-index:10;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  nav.tabs .bar{
    display:flex; gap:2px; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; padding:4px; box-shadow:var(--shadow); max-width:760px; width:100%;
    overflow-x:auto; scrollbar-width:none;
  }
  nav.tabs .bar::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:1 0 auto; min-width:58px; border:none; background:transparent; color:var(--muted); font:inherit;
    font-weight:600; font-size:11.5px; padding:9px 7px; border-radius:12px; cursor:pointer; white-space:nowrap;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabs button .ic{ font-size:17px; line-height:1; }
  nav.tabs button.active{ background:var(--accent); color:var(--accent-ink); }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); }
  .card h2{ margin:0 0 12px; font-size:15px; font-weight:700; }
  .row{ display:flex; gap:10px; align-items:center; }
  .col{ display:flex; flex-direction:column; gap:8px; }
  .grow{ flex:1; }
  .muted{ color:var(--muted); font-size:13px; }
  .small{ font-size:12.5px; }

  input[type=text], input[type=number], input[type=search], select{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--text); font:inherit; font-size:15px;
  }
  input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  label{ font-size:12.5px; font-weight:600; color:var(--muted); }

  button.btn{
    border:none; border-radius:var(--radius-sm); padding:11px 16px; font:inherit; font-weight:700;
    font-size:14px; cursor:pointer; background:var(--surface-2); color:var(--text); border:1px solid var(--border);
  }
  button.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  button.btn.ok{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  button.btn.bad{ background:var(--bad-bg); color:var(--bad); border-color:transparent; }
  button.btn:disabled{ opacity:.45; cursor:not-allowed; }
  button.btn.big{ font-size:16px; padding:14px 18px; }
  button.icon-btn{ border:1px solid var(--border); background:var(--surface-2); color:var(--text); border-radius:10px; width:44px; height:44px; font-size:18px; cursor:pointer; }

  .scan-input-wrap{ position:relative; }
  #scanInput{ font-size:20px; padding:16px 52px 16px 14px; font-family:'JetBrains Mono',monospace; letter-spacing:.02em; }
  .scan-cam-btn{ position:absolute; right:6px; top:6px; bottom:6px; width:40px; border-radius:8px; border:none; background:transparent; font-size:20px; cursor:pointer; color:var(--muted); }

  .result-empty{ padding:30px 10px; text-align:center; color:var(--muted); }
  .result-empty .big-ic{ font-size:34px; display:block; margin-bottom:8px; }

  .item-card .name{ font-size:16px; font-weight:700; line-height:1.3; margin-bottom:6px; }
  .item-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; margin-bottom:14px; }
  .item-meta .m{ font-size:12.5px; color:var(--muted); }
  .item-meta .m b{ color:var(--text); font-family:'JetBrains Mono',monospace; font-weight:600; }
  .stock-pill{ display:inline-flex; align-items:baseline; gap:6px; padding:8px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); margin-bottom:16px; }
  .stock-pill .num{ font-size:22px; font-weight:800; font-family:'JetBrains Mono',monospace; }
  .stock-pill.zero{ background:var(--warn-bg); }

  .qty-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .qty-row input{ width:70px; text-align:center; flex:0 0 70px; }
  .action-row{ display:flex; gap:10px; }
  .action-row .btn{ flex:1; padding:14px; font-size:15px; }

  .not-found-box{ text-align:center; padding:10px 4px 4px; }
  .not-found-box .big-ic{ font-size:32px; }
  .flash{ animation:flashok .6s ease; }
  @keyframes flashok{ 0%{ background:var(--ok-bg); } 100%{ background:var(--surface); } }

  table.data{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.data th{ text-align:left; font-size:11.5px; color:var(--muted); text-transform:none; font-weight:600; padding:6px 8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); }
  table.data td{ padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  table.data tr:last-child td{ border-bottom:none; }
  .tbl-scroll{ max-height:420px; overflow:auto; border:1px solid var(--border); border-radius:var(--radius-sm); }
  .tbl-scroll.short{ max-height:220px; }
  .num-cell{ font-family:'JetBrains Mono',monospace; text-align:right; white-space:nowrap; }
  .zero-cell{ color:var(--bad); }

  .stats-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .stat{ flex:1; min-width:100px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; }
  .stat .lbl{ font-size:11px; color:var(--muted); margin-bottom:3px; }
  .stat .stat-num{ font-size:19px; font-weight:700; }

  details.batch{ border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; overflow:hidden; }
  details.batch summary{ padding:11px 12px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; gap:8px; align-items:center; background:var(--surface-2); }
  details.batch summary::-webkit-details-marker{ display:none; }
  .tag{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--accent); color:var(--accent-ink); }
  .batch-body{ padding:10px 12px; }

  .step-wizard .step{ border-top:1px dashed var(--border); padding-top:14px; margin-top:14px; }
  .step-wizard .step:first-child{ border-top:none; padding-top:0; margin-top:0; }
  .step-num{ display:inline-flex; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink); font-size:11px; font-weight:800; align-items:center; justify-content:center; margin-right:6px; }

  .preview-row.picked{ outline:2px solid var(--accent); outline-offset:-2px; background:var(--ok-bg) !important; }
  .preview-row{ cursor:pointer; }
  .preview-row:hover{ background:var(--surface-2); }

  .banner{ padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:2px; }
  .banner.info{ background:var(--surface-2); color:var(--muted); border:1px solid var(--border); }
  .banner.ok{ background:var(--ok-bg); color:var(--ok); }
  .banner.bad{ background:var(--bad-bg); color:var(--bad); }
  .banner.warn{ background:var(--warn-bg); color:var(--text); }

  .cam-overlay{ position:fixed; inset:0; background:#000; z-index:50; display:flex; flex-direction:column; }
  .cam-overlay video{ flex:1; object-fit:cover; width:100%; }
  .cam-overlay .cam-close{ position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:16px; background:rgba(0,0,0,.55); color:#fff; border:none; width:40px; height:40px; border-radius:50%; font-size:18px; z-index:2; }
  .cam-overlay .cam-hint{ position:absolute; bottom:calc(30px + env(safe-area-inset-bottom,0px)); left:0; right:0; text-align:center; color:#fff; font-size:13px; }
  .cam-overlay .cam-frame{ position:absolute; top:50%; left:50%; width:78%; max-width:340px; height:110px; transform:translate(-50%,-50%); border:2px solid var(--accent); border-radius:12px; box-shadow:0 0 0 2000px rgba(0,0,0,.35); }

  .checkbox-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip-check{ display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:6px 10px 6px 8px; font-size:12.5px; cursor:pointer; }
  .chip-check input{ width:auto; accent-color:var(--accent); }

  a.link-btn{ text-decoration:none; }
  ::placeholder{ color: color-mix(in srgb, var(--muted) 80%, transparent); }

  .radio-line{ display:flex; gap:16px; }
  .radio-line label{ display:flex; align-items:center; gap:6px; font-weight:500; color:var(--text); font-size:13.5px; }
  .radio-line input{ width:auto; accent-color:var(--accent); }

  .empty-state{ text-align:center; padding:28px 10px; color:var(--muted); }
  .empty-state .big-ic{ font-size:30px; display:block; margin-bottom:8px; }

  @media (min-width:600px){
    .action-row .btn{ font-size:16px; }
  }
</style>
</head>
<body>
<img src="/assets/founder.png" alt="" class="founder-photo">

<div class="shell">
  <header class="top">
    <div>
      <h1>Repairkit <span id="cityTitle">· Склад · Иваново</span></h1>
      <div class="sub" id="connStatus">Подключение…</div>
    </div>
    <div class="sub" id="itemsCountBadge"></div>
    <button onclick="window.__setApiKey()" style="border:none;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;" title="Ключ доступа">⚙</button>
  </header>

  <main id="main"></main>

  <nav class="tabs">
    <div class="bar" id="tabBar">
      <button data-tab="scan" class="active"><span class="ic">🔦</span>Скан</button>
      <button data-tab="ship"><span class="ic">📦</span>Отгрузка</button>
      <button data-tab="nomen"><span class="ic">📋</span>Номенклатура</button>
      <button data-tab="stock"><span class="ic">📥</span>Остатки</button>
      <button data-tab="orders"><span class="ic">🧾</span>Заказы</button>
      <button data-tab="ledger"><span class="ic">💰</span>Начисления</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- state ---------------- */
  
  var items = new Map();        // sku -> {sku,article,name,barcode,stock,updatedAt}
  var barcodeIndex = new Map(); // normalized barcode -> sku
  var articleIndex = new Map(); // lower-cased article -> sku
  var orderBatches = new Map(); // id -> {marketplace,fileName,uploadedAt,columns,rows,partOf,partIndex,partsTotal}
  var recentScans = [];         // client-side only, most recent first
  var tariff = [];              // price list rows from the server
  var tariffMap = {};
  var who = null;               // {city, name} of the warehouse this key belongs to
  var shippedKeys = new Set();  // "mp|order" of orders that are already shipped
  var uploadBusy = false;       // true while a bulk upload loop is running (guards against accidental navigation)
  window.addEventListener('beforeunload', function(e){
    if (uploadBusy){ e.preventDefault(); e.returnValue = ''; }
  });
  var currentTab = "scan";
  var camStream = null;

  var els = { main: document.getElementById('main'), status: document.getElementById('connStatus'), badge: document.getElementById('itemsCountBadge') };

  /* ---------------- helpers ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    for (var k in attrs){
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === 'class') e.className = attrs[k];
      else if (k === 'html') e.innerHTML = attrs[k];
      else if (k.indexOf('on') === 0 && typeof attrs[k] === 'function') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ if (c!=null) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function fmtInt(n){ n = Number(n)||0; return n.toLocaleString('ru-RU'); }
  function esc(s){ return (s==null?'':String(s)); }
  function normBarcode(s){ return String(s==null?'':s).trim().toUpperCase(); }
  function splitBarcodes(raw){
    if (raw == null) return [];
    return String(raw).split(/[,;]/).map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function nowIso(){ return new Date().toISOString(); }
  var MP_LABEL = { wb:'WB', ozon:'Ozon', ym:'Яндекс-Маркет' };
  function mpKey(text){
    var t = String(text||'').toLowerCase();
    if (/wild|вайлд|(^|[^a-z])wb([^a-z]|$)/.test(t)) return 'wb';
    if (/ozon|озон/.test(t)) return 'ozon';
    if (/яндекс|yandex|(^|[^a-z])ym([^a-z]|$)|маркет/.test(t)) return 'ym';
    return '';
  }
  function fmtMoney(n){
    n = Number(n)||0;
    var frac = Math.abs(n - Math.round(n)) > 0.004;
    return n.toLocaleString('ru-RU', { minimumFractionDigits: frac?2:0, maximumFractionDigits: 2 }) + ' ₽';
  }
  function fmtQty(n){ return (Number(n)||0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
  function tprice(key){ var t = tariffMap[key]; return t ? (Number(t.price)||0) : 0; }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  var CYR2LAT = {'А':'A','В':'B','Е':'E','К':'K','М':'M','Н':'H','О':'O','Р':'P','С':'C','Т':'T','Х':'X','У':'Y'};
  // normalises a storage location for comparison only (Cyrillic look-alikes -> Latin, dash variants, no spaces)
  function normLoc(s){
    return String(s==null?'':s).trim().toUpperCase().replace(/[–—−]/g,'-').replace(/\s+/g,'')
      .replace(/[АВЕКМНОРСТХУ]/g, function(ch){ return CYR2LAT[ch]; });
  }
  function findByLocation(code){
    var n = normLoc(code);
    if (!n) return [];
    return Array.from(items.values()).filter(function(i){ return i.location && normLoc(i.location) === n; });
  }
  // finds an item by barcode, SKU or article found in a spreadsheet cell
  function lookupItemByCell(v){
    if (v == null) return null;
    var s = String(v).trim();
    if (!s) return null;
    var tokens = splitBarcodes(s);
    if (!tokens.length) tokens = [s];
    for (var t=0; t<tokens.length; t++){
      var tok = tokens[t];
      var sku = barcodeIndex.get(normBarcode(tok));
      if (sku && items.has(sku)) return items.get(sku);
      if (items.has(tok)) return items.get(tok);
      var sk2 = articleIndex.get(tok.toLowerCase());
      if (sk2 && items.has(sk2)) return items.get(sk2);
    }
    var sk3 = articleIndex.get(s.toLowerCase());
    if (sk3 && items.has(sk3)) return items.get(sk3);
    return null;
  }
  // true while the person is typing / a wizard is open — background refresh must not redraw the screen then
  function userIsBusy(){
    var a = document.activeElement;
    if (a && a !== document.body && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA')){
      if (['scanInput', 'shipScanInput', 'shipOrderInput'].indexOf(a.id) < 0 || a.value) return true;
    }
    if (document.querySelector('.step-wizard')) return true;
    return false;
  }
  function safeId(s){ var v = String(s==null?'':s).trim().replace(/[^A-Za-z0-9_.~:@+-]/g,'-').slice(0,180); return v || ('X'+Date.now()); }
  function toast(msg, kind){
    var t = el('div', {class:'banner ' + (kind||'info'), style:'position:fixed;left:16px;right:16px;bottom:96px;z-index:40;box-shadow:var(--shadow);'}, [msg]);
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2600);

  /* ---------------- API client ---------------- */
  var apiKey = localStorage.getItem('repairkit_api_key') || '';

  function apiHeaders(withJson){
    var h = {};
    if (withJson) h['Content-Type'] = 'application/json';
    if (apiKey) h['X-API-Key'] = apiKey;
    return h;
  }
  async function apiFetch(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, apiHeaders(!!opts.body), opts.headers || {});
    var res = await fetch(path, opts);
    if (!res.ok){
      var text = '';
      try{ text = await res.text(); }catch(e){}
      var err = new Error('HTTP ' + res.status + ' ' + text);
      err.status = res.status;
      throw err;
    }
    if (res.status === 204) return null;
    return res.json();
  }

  function setApiKey(){
    var v = prompt('Ключ доступа к серверу (оставьте пустым, если сервер без ключа):', apiKey);
    if (v === null) return;
    apiKey = v.trim();
    localStorage.setItem('repairkit_api_key', apiKey);
    initApp();
  }
  window.__setApiKey = setApiKey;

  /* ---------------- app init ---------------- */
  var lastItemsSig = '';
  var lastOrdersSig = '';
  var intervalsStarted = false;

  async function initApp(){
    els.status.textContent = 'Загрузка…';
    await Promise.all([refreshItems(true), loadWho(), loadTariff()]);
    refreshOrders(true);
    loadShipped();
    if (!intervalsStarted){
      intervalsStarted = true;
      setInterval(function(){ if (!uploadBusy) refreshItems(false); }, 15000);
      setInterval(function(){ if (!uploadBusy && currentTab === 'orders') refreshOrders(false); }, 20000);
    }
  }

  async function loadWho(){
    try{
      who = await apiFetch('/api/whoami');
      var t = '· Склад · ' + who.name;
      document.getElementById('cityTitle').textContent = t;
      document.title = 'Repairkit ' + t;

  async function loadTariff(){
    try{
      tariff = await apiFetch('/api/tariff');
      tariffMap = {};
      tariff.forEach(function(t){ tariffMap[t.key] = t; });
    }catch(e){}

  async function loadShipped(){
    try{ shippedKeys = new Set((await apiFetch('/api/shipped')).keys); }catch(e){}
  }
  async function loadShipOps(){
    try{ shipState.ops = await apiFetch('/api/ops?kind=ship&limit=15'); }catch(e){}

  function indexItem(it){
    items.set(it.sku, it);
    splitBarcodes(it.barcodeOzn).concat(splitBarcodes(it.barcode2)).forEach(function(b){ barcodeIndex.set(normBarcode(b), it.sku); });
    var art = String(it.article || '').trim().toLowerCase();
    if (art) articleIndex.set(art, it.sku);
  }

  async function refreshItems(force){
    try{
      var list = await apiFetch('/api/items');
      els.status.textContent = list.length ? 'Синхронизировано' : 'База пуста — загрузите номенклатуру';
      els.badge.textContent = list.length ? (fmtInt(list.length) + ' позиций') : '';
      var sig = list.length + '#' + list.map(function(i){ return i.sku + '|' + i.stock + '|' + (i.location||'') + '|' + (i.updatedAt||''); }).join(';');
      if (!force && sig === lastItemsSig) return;
      lastItemsSig = sig;
      items = new Map();
      barcodeIndex = new Map();
      articleIndex = new Map();
      list.forEach(indexItem);
      if (force || (!userIsBusy() && currentTab !== 'ledger')) render();
    }catch(e){
      if (e && e.status === 401) els.status.textContent = 'Не задан или неверен ключ доступа — нажмите ⚙';
      else if (e && e.status) els.status.textContent = 'Ошибка сервера (код ' + e.status + ')';
      else els.status.textContent = 'Нет соединения с сервером';
    }
  }

  async function refreshOrders(force){
    try{
      var list = await apiFetch('/api/orders');
      var sig = list.map(function(b){ return b.id; }).join(',');
      if (!force && sig === lastOrdersSig) return;
      lastOrdersSig = sig;
      orderBatches = new Map();
      list.forEach(function(b){ orderBatches.set(b.id, b); });
      if (currentTab === 'orders' && (force || !userIsBusy())) render();
    }catch(e){}
  }

  /* ---------------- render dispatch ---------------- */
  function render(){

    else if (currentTab === 'ship') renderShip();
    else if (currentTab === 'ledger') renderLedger();

  function rerenderIfIdle(){ if (!userIsBusy()) render(); }

  document.getElementById('tabBar').addEventListener('click', function(e){

  async function handleScan(raw){
    var code = normBarcode(raw);
    if (!code) return;
    var sku = barcodeIndex.get(code);
    scanState.locationView = null;
    if (sku && items.has(sku)){
      scanState.found = items.get(sku);
      scanState.notFoundCode = null;
    } else if (findByLocation(raw).length){
      // not an item barcode, but a known storage location label: show what lies there
      scanState.found = null;
      scanState.notFoundCode = null;
      scanState.locationView = { code: String(raw).trim() };
    } else {
      scanState.found = null;
      scanState.notFoundCode = code;
    }
    scanState.qty = 1;
    render();
  }

  function renderLocationCard(code){
    var list = findByLocation(code).sort(function(a,b){ return (a.name||'').localeCompare(b.name||'', 'ru'); });
    var box = el('div', {});
    box.appendChild(el('div', {class:'name'}, ['📍 Место ', el('span', {class:'loc-badge mono'}, [code])]));
    box.appendChild(el('div', {class:'muted small', style:'margin:8px 0 10px;'}, ['Позиций в этом месте: ' + list.length + '. Нажмите на позицию, чтобы открыть карточку.']));
    list.forEach(function(it){
      box.appendChild(el('div', {class:'loc-list-row', onclick:function(){
        scanState.found = items.get(it.sku) || it; scanState.locationView = null; scanState.qty = 1; render();
      }}, [
        el('span', {}, [it.name || it.sku]),
        el('span', {class:'mono', style:'font-weight:700;'}, [fmtInt(it.stock)])
      ]));
    });
    return box;
  }

  async function saveLocation(sku, value){
    var v = String(value == null ? '' : value).trim();
    if (!v){ toast('Введите место хранения', 'bad'); return; }
    if (barcodeIndex.has(normBarcode(v)) && !confirm('«' + v + '» похоже на штрихкод товара, а не на место хранения. Всё равно сохранить как место?')) return;
    await patchLocation(sku, v);
  }

  async function patchLocation(sku, v){
    try{
      var it = await apiFetch('/api/items/' + encodeURIComponent(sku), { method:'PATCH', body: JSON.stringify({ location: v }) });
      indexItem(it);
      if (scanState.found && scanState.found.sku === sku) scanState.found = it;
      toast(v ? ('Место сохранено: ' + v) : 'Место убрано', 'ok');
      render();
    }catch(e){ toast('Не удалось сохранить место', 'bad'); }
  }

  function editLocationPrompt(it){

      toast('Принято +' + qty + ' · ' + (r.item.name || sku) + ' · начислено ' + fmtMoney(r.total), 'ok');

  async function doWriteoff(sku, qty){
    try{
      var r = await apiFetch('/api/writeoff', { method:'POST', body: JSON.stringify({ sku: sku, qty: qty }) });
      indexItem(r.item);
      recentScans.unshift({ name: r.item.name, barcode: r.item.barcodeOzn || r.item.barcode2 || '', delta: -r.taken, opId: r.opId });
      recentScans = recentScans.slice(0, 20);
      toast(r.taken < qty ? ('Списано только ' + r.taken + ' (остаток был меньше) · ' + (r.item.name || sku)) : ('Списано ' + qty + ' · ' + (r.item.name || sku)), r.taken < qty ? 'warn' : 'ok');

      render();

      toast('Не удалось списать товар', 'bad');

  async function undoOp(opId, after){
    if (!confirm('Отменить операцию? Остаток и начисления вернутся назад.')) return;
    try{
      await apiFetch('/api/ops/' + opId + '/undo', { method:'POST' });
      recentScans.forEach(function(h){ if (h.opId === opId) h.undone = true; });
      toast('Операция отменена', 'ok');
      await Promise.all([refreshItems(true), loadShipped()]);
      if (after) await after();
    }catch(e){
      toast(e && /not_enough_stock/.test(e.message || '') ? 'Нельзя отменить приёмку: часть товара уже списана или отгружена' : 'Не удалось отменить операцию', 'bad');
    }
  }

  async function createNewItem(code){
    var name = document.getElementById('nfName').value.trim();
    var art = document.getElementById('nfArt').value.trim();
    var qty = Math.max(0, parseInt(document.getElementById('nfQty').value)||0);
    var nfLocEl = document.getElementById('nfLoc');
    var newLoc = nfLocEl ? nfLocEl.value.trim() : '';
    if (!name){ toast('Укажите название товара', 'bad'); return; }
    var sku = safeId('NEW-' + code);
    var isOzn = code.toUpperCase().indexOf('OZN')===0;
    try{
      var it = await apiFetch('/api/items/' + encodeURIComponent(sku), { method:'PUT', body: JSON.stringify({ article: art, name: name, barcodeOzn: isOzn?code:'', barcode2: isOzn?'':code, stock: 0, location: newLoc }) });
      indexItem(it);
      var rcv = null;
      if (qty > 0){ rcv = await apiFetch('/api/receive', { method:'POST', body: JSON.stringify({ sku: sku, qty: qty }) }); indexItem(rcv.item); }
      recentScans.unshift({ name: name, barcode: code, delta: qty, opId: rcv ? rcv.opId : null, total: rcv ? rcv.total : 0 });
      toast('Позиция создана' + (rcv ? ' · начислено ' + fmtMoney(rcv.total) : ''), 'ok');
      scanState.found = null; scanState.notFoundCode = null;
      render();
    }catch(e){ toast('Не удалось создать позицию', 'bad'); }
  }

  /* ---- camera scanning ---- */
  async function openCamera(){
    var overlay = el('div', {class:'cam-overlay'});
    var video = el('video', {autoplay:'', muted:'', playsinline:''});
    overlay.appendChild(video);
    overlay.appendChild(el('div', {class:'cam-frame'}));
    overlay.appendChild(el('div', {class:'cam-hint'}, ['Наведите камеру на штрихкод']));
    overlay.appendChild(el('button', {class:'cam-close', onclick:closeCamera}, ['✕']));
    document.body.appendChild(overlay);
    try{
      camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
      video.srcObject = camStream;
      var detector = new window.BarcodeDetector({ formats:['ean_13','ean_8','code_128','upc_a','upc_e','code_39'] });
      var stopped = false;
      overlay._stop = function(){ stopped = true; };
      (async function loop(){
        while(!stopped){
          try{
            var codes = await detector.detect(video);
            if (codes && codes.length){
              var val = codes[0].rawValue;
              closeCamera();
              document.getElementById('scanInput').value = val;
              handleScan(val);
              return;
            }
          }catch(e){}
          await new Promise(function(r){ setTimeout(r, 220); });
        }
      })();
    }catch(e){
      toast('Нет доступа к камере', 'bad');
      closeCamera();
    }
    function closeCamera(){
      if (overlay._stop) overlay._stop();
      if (camStream){ camStream.getTracks().forEach(function(t){ t.stop(); }); camStream = null; }
      overlay.remove();
    }
  }

  function renderNomenTable(holder){
    var all = Array.from(items.values());

    if (q){
      all = all.filter(function(i){
        return (i.name||'').toLowerCase().indexOf(q)>=0 || (i.article||'').toLowerCase().indexOf(q)>=0 ||
               (i.sku||'').toLowerCase().indexOf(q)>=0 || (i.barcodeOzn||'').toLowerCase().indexOf(q)>=0 ||
               (i.barcode2||'').toLowerCase().indexOf(q)>=0 || (i.location||'').toLowerCase().indexOf(q)>=0;
      });
    }

  async function addManualItem(name, article, sku, ozn, bc2, qtyRaw, location){
    if (!name){ toast('Укажите название товара', 'bad'); return; }
    var qty = Math.max(0, parseInt(qtyRaw)||0);
    var finalSku = sku ? safeId(sku) : safeId((article ? 'ART-'+article : 'ITEM-'+Date.now()));
    if (items.has(finalSku)){ toast('SKU уже существует: ' + finalSku, 'bad'); return; }
    try{
      var it = await apiFetch('/api/items/' + encodeURIComponent(finalSku), { method:'PUT', body: JSON.stringify({ article: article, name: name, barcodeOzn: ozn, barcode2: bc2, stock: 0, location: location || '' }) });
      indexItem(it);
      var rcv = null;
      if (qty > 0){ rcv = await apiFetch('/api/receive', { method:'POST', body: JSON.stringify({ sku: finalSku, qty: qty }) }); indexItem(rcv.item); }
      toast('Позиция добавлена' + (rcv ? ' · начислено ' + fmtMoney(rcv.total) : ''), 'ok');
      renderNomen();
    }catch(e){ toast('Не удалось добавить', 'bad'); }
  }

  async function applyNomenUpload(mapping, dataRows){
    var toWrite = [];
    dataRows.forEach(function(row){
      var article = mapping.article!=null ? row[mapping.article] : null;
      var sku = mapping.sku!=null ? row[mapping.sku] : null;
      var name = mapping.name!=null ? row[mapping.name] : null;
      var rawParts = [];
      if (mapping.barcodeOzn!=null) rawParts.push(row[mapping.barcodeOzn]);
      if (mapping.barcode2!=null && mapping.barcode2!==mapping.barcodeOzn) rawParts.push(row[mapping.barcode2]);
      var tokens = [];
      rawParts.forEach(function(p){ tokens = tokens.concat(splitBarcodes(p)); });
      var ozn = tokens.find(function(t){ return t.toUpperCase().indexOf('OZN')===0; }) || '';
      var b2 = tokens.find(function(t){ return t.toUpperCase().indexOf('OZN')!==0; }) || '';
      if (sku==null && !ozn && !b2) return;
      var skuStr = safeId(sku!=null ? String(sku).trim() : ('BC-' + (ozn||b2)));
      if (!skuStr) return;
      toWrite.push({ sku: skuStr, article: article!=null?String(article).trim():'', name: name!=null?String(name).trim():'', barcodeOzn: ozn, barcode2: b2 });
    });
    var done=0, created=0, updated=0;
    uploadBusy = true;
    try{
      for (var i=0;i<toWrite.length;i++){
        var r = toWrite[i];
        var existed = items.has(r.sku);
        try{
          var it = await apiFetch('/api/items/' + encodeURIComponent(r.sku), { method:'PUT', body: JSON.stringify({ article:r.article, name:r.name, barcodeOzn:r.barcodeOzn, barcode2:r.barcode2, stock:0 }) });
          indexItem(it);
          if (existed) updated++; else created++;
        }catch(e){}
        done++;
        if (done % 20 === 0) updateWizardProgress(done, toWrite.length);
      }
    } finally {
      uploadBusy = false;
    }
    updateWizardProgress(done, toWrite.length, true);
    toast('Номенклатура обновлена: ' + updated + ' обновлено, ' + created + ' создано', 'ok');
  }

  async function applyLocationsUpload(mapping, dataRows){
    if (mapping.id == null || mapping.location == null){ toast('Выберите столбец товара и столбец места', 'bad'); return; }
    var perSku = new Map();
    var notFound = [];
    dataRows.forEach(function(row){
      var ident = row[mapping.id];
      var loc = row[mapping.location];
      if (ident == null) return;
      var locStr = loc == null ? '' : String(loc).trim();
      if (!locStr) return;
      var it = lookupItemByCell(ident);
      if (it) perSku.set(it.sku, locStr); else notFound.push({ ident: String(ident), loc: locStr });
    });
    var rows = Array.from(perSku.entries()).map(function(e){ return { sku: e[0], location: e[1] }; });
    var total = rows.length, done = 0;
    uploadBusy = true;
    try{
      for (var i=0; i<rows.length; i+=500){
        var chunk = rows.slice(i, i+500);
        await apiFetch('/api/items/locations', { method:'POST', body: JSON.stringify({ rows: chunk }) });
        done += chunk.length;
        updateWizardProgress(done, total);
      }
    }catch(e){
      toast('Ошибка сохранения мест', 'bad');
      return;
    } finally {
      uploadBusy = false;
    }
    perSku.forEach(function(loc, sku){ var it = items.get(sku); if (it) it.location = loc; });
    updateWizardProgress(done, total, true);
    renderLocationsResult(document.getElementById('locUploadWizard'), total, notFound);
  }

  async function applyStockUpload(mapping, dataRows, mode){
    if (mapping.barcode==null || mapping.qty==null){ toast('Выберите столбцы штрихкода и количества', 'bad'); return; }
    var perSku = new Map(); // sku -> summed qty
    var notFound = [];
    dataRows.forEach(function(row){
      var rawBc = row[mapping.barcode];
      var rawQty = row[mapping.qty];
      if (rawBc==null) return;
      var qty = parseFloat(String(rawQty==null?'0':rawQty).replace(',','.')) || 0;
      var tokens = splitBarcodes(rawBc);
      var matchedSku = null;
      for (var t=0;t<tokens.length;t++){
        var sku = barcodeIndex.get(normBarcode(tokens[t]));
        if (sku){ matchedSku = sku; break; }
      }
      if (matchedSku){
        perSku.set(matchedSku, (perSku.get(matchedSku)||0) + qty);
      } else {
        notFound.push({ barcode: tokens.join('; '), qty: qty });
      }
    });
    var done=0, total=perSku.size;
    var skus = Array.from(perSku.keys());
    uploadBusy = true;
    try{
      for (var i=0;i<skus.length;i++){
        var sku = skus[i];
        var addQty = perSku.get(sku);
        try{
          var body = mode === 'replace' ? { stock: Math.max(0, addQty) } : { delta: addQty };
          var it = await apiFetch('/api/items/' + encodeURIComponent(sku) + '/stock', { method:'POST', body: JSON.stringify(body) });
          indexItem(it);
        }catch(e){}
        done++;
        if (done % 15 === 0) updateWizardProgress(done, total);
      }
    } finally {
      uploadBusy = false;
    }
    updateWizardProgress(done, total, true);
    renderStockResult(document.getElementById('stockUploadWizard'), total, notFound);
  }

    var fileInput = el('input', {type:'file', accept:'.xlsx,.xls,.csv'});
    fileInput.addEventListener('change', function(e){
      if (!mpInput.value.trim()){ toast('Укажите маркетплейс перед загрузкой', 'bad'); this.value=''; return; }

    });

    uploadCard.appendChild(el('div', {id:'ordersUploadWizard'}));
    wrap.appendChild(uploadCard);

    var batches = Array.from(orderBatches.values());
    var mpSet = Array.from(new Set(batches.map(function(b){ return b.marketplace; }))).filter(Boolean);
    var totalRows = batches.reduce(function(a,b){ return a + (b.rows?b.rows.length:0); }, 0);
    var stats = el('div', {class:'stats-row'}, [
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Загрузок']), el('div',{class:'stat-num'},[fmtInt(batches.length)])]),
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Строк заказов']), el('div',{class:'stat-num'},[fmtInt(totalRows)])]),
      el('div', {class:'stat'}, [el('div',{class:'lbl'},['Маркетплейсов']), el('div',{class:'stat-num'},[fmtInt(mpSet.length)])])
    ]);
    wrap.appendChild(stats);

    var listCard = el('div', {class:'card'});
    listCard.appendChild(el('h2', {}, ['Загруженные заказы']));
    if (mpSet.length>1){
      var filterSel = el('select', {style:'margin-bottom:10px;'});
      filterSel.appendChild(el('option', {value:''}, ['Все маркетплейсы']));
      mpSet.forEach(function(m){ filterSel.appendChild(el('option', {value:m, selected: m===ordersFilterMp?'selected':null}, [m])); });
      filterSel.addEventListener('change', function(){ ordersFilterMp = this.value; renderOrders(); });
      listCard.appendChild(filterSel);
    }
    var visible = batches.filter(function(b){ return !ordersFilterMp || b.marketplace===ordersFilterMp; })
                          .sort(function(a,b){ return (b.uploadedAt||'').localeCompare(a.uploadedAt||''); });
    if (!visible.length){
      listCard.appendChild(el('div', {class:'empty-state'}, [el('span',{class:'big-ic'},['🧾']), 'Заказы ещё не загружены']));
    } else {
      visible.forEach(function(b){ listCard.appendChild(renderBatchDetails(b)); });
    }
    wrap.appendChild(listCard);
    els.main.appendChild(wrap);

  function renderBatchDetails(b){
    var d = el('details', {class:'batch'});
    var dateStr = b.uploadedAt ? new Date(b.uploadedAt).toLocaleString('ru-RU') : '';
    d.appendChild(el('summary', {}, [
      el('span', {}, [el('span',{class:'tag'},[b.marketplace||'—']), ' ', el('b',{},[b.fileName||'']) ]),
      el('span', {class:'muted small'}, [(b.rows?b.rows.length:0) + ' стр · ' + dateStr])
    ]));
    var body = el('div', {class:'batch-body'});
    d.appendChild(body);
    var built = false;
    function build(){ if (built) return; built = true; fillBatchBody(body, b); }
    if (openBatches.has(b.id)){ d.open = true; build(); }
    d.addEventListener('toggle', function(){
      if (d.open){ openBatches.add(b.id); build(); } else { openBatches.delete(b.id); }
    });
    return d;
  }

  // the column whose values match our nomenclature best (barcode / SKU / article)
  function detectIdColumn(b, cols){
    var sample = (b.rows || []).slice(0, 150);
    var best = null, bestN = 0;
    cols.forEach(function(c){
      var n = 0;
      sample.forEach(function(r){ if (lookupItemByCell(r[c])) n++; });
      if (n > bestN){ bestN = n; best = c; }
    });
    return best;
  }

  function fillBatchBody(body, b){
    body.innerHTML = '';
    var cols = b.columns || (b.rows && b.rows[0] ? Object.keys(b.rows[0]) : []);
    var idCol = detectIdColumn(b, cols);
    var view = (b.rows || []).map(function(r){ return { row: r, it: idCol ? lookupItemByCell(r[idCol]) : null }; });

    if (idCol){
      var found = view.filter(function(x){ return x.it; }).length;
      body.appendChild(el('div', {class:'muted small', style:'margin-bottom:8px;'}, ['Товар определён по столбцу «' + idCol + '». Найдено в номенклатуре: ' + found + ' из ' + view.length + '.']));
      var sorted = sortByLoc.has(b.id);
      body.appendChild(el('button', {class:'btn small', style:'margin-bottom:8px;', onclick:function(){
        if (sorted) sortByLoc.delete(b.id); else sortByLoc.add(b.id);
        fillBatchBody(body, b);
      }}, [sorted ? '↕ Порядок из файла' : '↕ Сортировать по месту']));
      if (sorted){
        view.sort(function(x, y){
          var a = x.it && x.it.location ? normLoc(x.it.location) : '';
          var c = y.it && y.it.location ? normLoc(y.it.location) : '';
          if (!a && !c) return 0;
          if (!a) return 1;
          if (!c) return -1;
          return a.localeCompare(c, 'ru', { numeric: true });
        });
      }
    } else {
      body.appendChild(el('div', {class:'muted small', style:'margin-bottom:8px;'}, ['Не удалось сопоставить строки с номенклатурой (нет столбца с артикулом, SKU или штрихкодом) — места не показаны.']));
    }

    var headCols = cols.slice();
    if (idCol) headCols = headCols.concat(['Место', 'Остаток']);
    var tblWrap = el('div', {class:'tbl-scroll short'});
    var table = el('table', {class:'data'});
    table.appendChild(el('thead', {}, [el('tr', {}, headCols.map(function(c){ return el('th',{},[c]); }))]));
    var tbody = el('tbody');
    view.slice(0, 100).forEach(function(x){
      var tds = cols.map(function(c){ return el('td', {}, [x.row[c]==null?'':String(x.row[c])]); });
      if (idCol){
        if (x.it){
          tds.push(el('td', {class:'mono', style:'font-weight:700;white-space:nowrap;'}, [x.it.location || '—']));
          tds.push(el('td', {class:'num-cell' + (x.it.stock<=0?' zero-cell':'')}, [fmtInt(x.it.stock)]));
        } else {
          tds.push(el('td', {class:'muted small'}, ['нет в номенклатуре']));
          tds.push(el('td', {}, ['']));
        }
      }
      tbody.appendChild(el('tr', {}, tds));
    });
    table.appendChild(tbody); tblWrap.appendChild(table);
    body.appendChild(tblWrap);
    if (view.length > 100) body.appendChild(el('div', {class:'muted small', style:'padding:6px 2px;'}, ['Показаны первые 100 из ' + view.length]));
    body.appendChild(el('button', {class:'btn bad small', style:'margin-top:8px;', onclick:function(){ deleteBatch(b.id); }}, ['Удалить загрузку']));
  }

  async function deleteBatch(id){
    try{ await apiFetch('/api/orders/' + encodeURIComponent(id), { method:'DELETE' }); toast('Загрузка удалена', 'ok'); refreshOrders(true); }
    catch(e){ toast('Не удалось удалить', 'bad'); }
  }

  function startOrdersUpload(file, marketplace, fileName){
    readWorkbook(file, function(wb, sheetNames){
      renderUploadWizard(document.getElementById('ordersUploadWizard'), wb, sheetNames, {
        columnKeepMode: true,
        metaFields: [
          { key:'orderCol', label:'Номер заказа / отправления', guess:['номер отправления','номер заказа','номер задания','posting','отправлен','заказ','задани'] },
          { key:'idCol', label:'Товар (артикул, SKU или штрихкод)', guess:['артикул','sku','штрихкод','баркод','offer'], detect: detectIdColumnFromRows },
          { key:'qtyCol', label:'Количество', guess:['количество','кол-во','колич','qty','шт'] }
        ],
        onApply: function(keptCols, dataRows, meta){
          applyOrdersUpload(marketplace, fileName, keptCols, dataRows, meta);
        }
      });
    });
  }

  function detectIdColumnFromRows(headers, rows){
    var sample = rows.slice(0, 150), best = null, bestN = 0;
    headers.forEach(function(h){
      var n = 0;
      sample.forEach(function(r){ if (lookupItemByCell(r[h])) n++; });
      if (n > bestN){ bestN = n; best = h; }
    });
    return best;
  }

  async function applyOrdersUpload(marketplace, fileName, keptCols, dataRows, meta){
    var rows = dataRows.map(function(row){
      var o = {};
      keptCols.forEach(function(c){ o[c] = row[c]==null?'':row[c]; });
      return o;
    }).filter(function(o){ return Object.values(o).some(function(v){ return v!==''; }); });
    try{
      var res = await apiFetch('/api/orders', { method:'POST', body: JSON.stringify({ marketplace: marketplace, fileName: fileName, columns: keptCols, rows: rows, meta: meta || {} }) });
      toast('Заказы сохранены: ' + res.rowCount + ' строк', 'ok');
      document.getElementById('ordersUploadWizard').innerHTML = '';
      refreshOrders(true);
    }catch(e){ toast('Ошибка сохранения заказов', 'bad'); }
  }

  /* ================= generic upload wizard (shared) ================= */
  function readWorkbook(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        cb(wb, wb.SheetNames);
      }catch(err){ toast('Не удалось прочитать файл', 'bad'); }
    };
    reader.readAsArrayBuffer(file);
  }

  function guessHeaderRow(rows){
    var bestIdx = 0, bestScore = -1;
    for (var i=0;i<Math.min(rows.length,15);i++){
      var r = rows[i]||[];
      var score = r.filter(function(c){ return typeof c === 'string' && c.trim().length>0; }).length;
      if (score > bestScore){ bestScore = score; bestIdx = i; }
    }
    return bestIdx;
  }

  function renderUploadWizard(container, wb, sheetNames, opts){
    container.innerHTML = '';
    var state = { sheet: sheetNames[0], headerRow: 0, rows: [] };

    function loadSheet(){
      var ws = wb.Sheets[state.sheet];
      state.rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:null, raw:true});
      state.headerRow = guessHeaderRow(state.rows);
      renderAll();
    }

    function renderAll(){
      container.innerHTML = '';
      var wiz = el('div', {class:'step-wizard'});

      if (sheetNames.length>1){
        var s1 = el('div', {class:'step'});
        s1.appendChild(el('div', {}, [el('span',{class:'step-num'},['1']), 'Лист файла']));
        var sel = el('select', {style:'margin-top:8px;'});
        sheetNames.forEach(function(n){ sel.appendChild(el('option', {value:n, selected: n===state.sheet?'selected':null}, [n])); });
        sel.addEventListener('change', function(){ state.sheet = this.value; loadSheet(); });
        s1.appendChild(sel);
        wiz.appendChild(s1);
      }

      var s2 = el('div', {class:'step'});
      s2.appendChild(el('div', {}, [el('span',{class:'step-num'},[sheetNames.length>1?'2':'1']), 'Укажите строку с заголовками (кликните по строке)']));
      var prevWrap = el('div', {class:'tbl-scroll short', style:'margin-top:8px;'});
      var prevTable = el('table', {class:'data'});
      var prevBody = el('tbody');
      state.rows.slice(0,15).forEach(function(r, idx){
        var tr = el('tr', {class:'preview-row' + (idx===state.headerRow?' picked':''), onclick:function(){ state.headerRow = idx; renderAll(); }});
        tr.appendChild(el('td', {class:'mono muted', style:'width:26px;'}, [String(idx+1)]));
        (r||[]).slice(0,8).forEach(function(c){ tr.appendChild(el('td', {}, [c==null?'':String(c)])); });
        prevBody.appendChild(tr);
      });
      prevTable.appendChild(prevBody);
      prevWrap.appendChild(prevTable);
      s2.appendChild(prevWrap);
      wiz.appendChild(s2);

      var headerRowVals = (state.rows[state.headerRow]||[]).map(function(c,i){ return c==null || String(c).trim()==='' ? ('Столбец '+(i+1)) : String(c).trim(); });
      var dataRowsRaw = state.rows.slice(state.headerRow+1).filter(function(r){ return r && r.some(function(c){ return c!=null && String(c).trim()!==''; }); });
      var dataRowObjs = dataRowsRaw.map(function(r){ var o={}; headerRowVals.forEach(function(h,i){ o[h]=r[i]!=null?r[i]:null; }); return o; });

      var s3 = el('div', {class:'step'});
      var stepN = sheetNames.length>1 ? '3' : '2';

      if (opts.columnKeepMode){
        s3.appendChild(el('div', {}, [el('span',{class:'step-num'},[stepN]), 'Какие столбцы сохранить']));
        var chipsWrap = el('div', {class:'checkbox-list', style:'margin-top:8px;'});
        var checks = {};
        headerRowVals.forEach(function(h){
          var cb = el('input', {type:'checkbox', checked:'checked'});
          checks[h] = cb;
          chipsWrap.appendChild(el('label', {class:'chip-check'}, [cb, h]));
        });
        s3.appendChild(chipsWrap);
        var metaSel = {};
        if (opts.metaFields){
          var metaBox = el('div', {class:'col', style:'margin-top:14px;'});
          metaBox.appendChild(el('div', {class:'muted small'}, ['Чтобы собирать и отгружать эти заказы на вкладке «Отгрузка», укажите столбцы:']));
          opts.metaFields.forEach(function(f){
            var fr = el('div', {});
            fr.appendChild(el('label', {}, [f.label]));
            var msel = el('select', {style:'margin-top:4px;'});
            msel.appendChild(el('option', {value:''}, ['— не использовать —']));
            headerRowVals.forEach(function(h){ msel.appendChild(el('option', {value:h}, [h])); });
            var g = f.detect ? f.detect(headerRowVals, dataRowObjs) : null;
            if (!g) g = headerRowVals.find(function(h){ return f.guess.some(function(k){ return h.toLowerCase().indexOf(k) >= 0; }); });
            if (g) msel.value = g;
            metaSel[f.key] = msel;
            fr.appendChild(msel);
            metaBox.appendChild(fr);
          });
          s3.appendChild(metaBox);
        }
        wiz.appendChild(s3);

        var s4 = el('div', {class:'step'});
        s4.appendChild(el('div', {}, [el('span',{class:'step-num'},[String(Number(stepN)+1)]), fmtInt(dataRowObjs.length) + ' строк готовы к сохранению']));
        s4.appendChild(el('button', {class:'btn primary big', style:'width:100%;margin-top:10px;', onclick:function(){
          var kept = headerRowVals.filter(function(h){ return checks[h].checked; });
          var meta = {};
          Object.keys(metaSel).forEach(function(k){
            var v = metaSel[k].value;
            if (v){ meta[k] = v; if (kept.indexOf(v) < 0) kept.push(v); }
          });
          opts.onApply(kept, dataRowObjs, meta);
        }}, ['Сохранить заказы']));
        wiz.appendChild(s4);
      } else {
        s3.appendChild(el('div', {}, [el('span',{class:'step-num'},[stepN]), 'Сопоставьте столбцы']));
        var mapping = {};
        var grid = el('div', {class:'col', style:'margin-top:8px;'});
        opts.fields.forEach(function(f){
          var row = el('div', {});
          row.appendChild(el('label', {}, [f.label]));
          var sel = el('select', {style:'margin-top:4px;'});
          sel.appendChild(el('option', {value:''}, ['— не использовать —']));
          headerRowVals.forEach(function(h){ sel.appendChild(el('option', {value:h}, [h])); });
          var guessMatch = headerRowVals.find(function(h){ return f.guess.some(function(g){ return h.toLowerCase().indexOf(g)>=0; }); });
          if (guessMatch) sel.value = guessMatch;
          mapping[f.key] = sel.value || null;
          sel.addEventListener('change', function(key, selEl){ return function(){ mapping[key] = selEl.value || null; }; }(f.key, sel));
          row.appendChild(sel);
          grid.appendChild(row);
        });
        s3.appendChild(grid);
        wiz.appendChild(s3);

        if (opts.extraControl){
          var s4b = el('div', {class:'step'});
          opts.extraControl(s4b);
          wiz.appendChild(s4b);
        }

        var s5 = el('div', {class:'step'});
        s5.appendChild(el('div', {}, [fmtInt(dataRowObjs.length) + ' строк будет обработано']));
        s5.appendChild(el('div', {id:'wizProgress', class:'muted small', style:'margin:6px 0;'}));
        s5.appendChild(el('button', {class:'btn primary big', style:'width:100%;margin-top:6px;', onclick:function(){
          opts.onApply(mapping, dataRowObjs);
        }}, ['Применить']));
        wiz.appendChild(s5);
      }

      container.appendChild(wiz);
    }

    loadSheet();
  }

  function updateWizardProgress(done, total, finished){
    var p = document.getElementById('wizProgress');
    if (!p) return;
    p.textContent = finished ? ('Готово: ' + fmtInt(done) + ' из ' + fmtInt(total)) : ('Обработано ' + fmtInt(done) + ' из ' + fmtInt(total) + '…');
  }

  /* ================= SHIPMENT TAB (отгрузка по заказу) ================= */
  var shipState = { order:null, mp:'', filter:'', pack:{ pack_bag:0, pack_box:0 }, ops:[], busy:false };
  var ORDER_GUESS = ['номер отправления','номер заказа','номер задания','posting','отправлен','заказ','задани'];
  var QTY_GUESS = ['количество','кол-во','колич','qty','шт'];
  var orderIndexSig = '', orderIndex = new Map();

  function guessCol(cols, keys){
    for (var k = 0; k < keys.length; k++){
      var f = cols.find(function(c){ return String(c).toLowerCase().indexOf(keys[k]) >= 0; });
      if (f) return f;
    }
    return null;
  }
  function getBatchMeta(b){
    var m = b.meta || {};
    var cols = b.columns || (b.rows && b.rows[0] ? Object.keys(b.rows[0]) : []);
    return {
      orderCol: m.orderCol || guessCol(cols, ORDER_GUESS),
      qtyCol: m.qtyCol || guessCol(cols, QTY_GUESS),
      idCol: m.idCol || detectIdColumn(b, cols)
    };
  }

  // orders found in the uploaded files, grouped by marketplace + order number
  function buildOrderIndex(){
    var sig = Array.from(orderBatches.keys()).sort().join(',') + '|' + items.size;
    if (sig === orderIndexSig) return orderIndex;
    orderIndexSig = sig;
    orderIndex = new Map();
    orderBatches.forEach(function(b){
      var meta = getBatchMeta(b);
      if (!meta.orderCol) return;
      var mp = mpKey(b.marketplace);
      (b.rows || []).forEach(function(r){
        var no = String(r[meta.orderCol] == null ? '' : r[meta.orderCol]).trim();
        if (!no) return;
        var key = mp + '|' + no;
        var o = orderIndex.get(key);
        if (!o){ o = { key: key, mp: mp, no: no, lines: new Map(), unknown: [] }; orderIndex.set(key, o); }
        var cell = meta.idCol ? r[meta.idCol] : null;
        var q = meta.qtyCol ? parseFloat(String(r[meta.qtyCol]).replace(',', '.')) : 1;
        q = isFinite(q) && q > 0 ? Math.round(q) || 1 : 1;
        var it = lookupItemByCell(cell);
        if (it){
          var L = o.lines.get(it.sku);
          if (!L){ L = { sku: it.sku, need: 0 }; o.lines.set(it.sku, L); }
          L.need += q;
        } else {
          o.unknown.push({ ident: cell == null ? '' : String(cell), need: q });
        }
      });
    });
    return orderIndex;
  }

  function defaultPack(){
    var mp = shipState.mp;
    shipState.pack = { pack_bag: (mp === 'ozon' || mp === 'ym') ? 1 : 0, pack_box: mp === 'wb' ? 1 : 0 };
  }
  function openOrder(o){
    if (shippedKeys.has(o.key)){ toast('Заказ уже отгружен', 'bad'); return; }
    shipState.order = {
      key: o.key, no: o.no, manual: false, unknown: o.unknown.slice(),
      lines: Array.from(o.lines.values()).map(function(L){ return { sku: L.sku, need: L.need, picked: 0 }; })
    };
    shipState.mp = o.mp || '';
    defaultPack();
    render();
  }
  function openManual(no){
    shipState.order = { key: '', no: no, manual: true, unknown: [], lines: [] };
    shipState.mp = '';
    defaultPack();
    render();
  }
  function openOrderByNumber(raw){
    var no = String(raw || '').trim();
    if (!no) return;
    var matches = Array.from(buildOrderIndex().values()).filter(function(o){ return o.no === no; });
    var open = matches.filter(function(o){ return !shippedKeys.has(o.key); });
    if (open.length === 1){ openOrder(open[0]); return; }
    if (open.length > 1){ shipState.filter = no; render(); toast('Этот номер есть у нескольких маркетплейсов — выберите из списка', 'warn'); return; }
    if (matches.length){ toast('Заказ ' + no + ' уже отгружен', 'bad'); return; }
    if (confirm('Заказ «' + no + '» не найден в загруженных файлах. Собрать вручную?')) openManual(no);
  }

  function shipScan(raw){
    var code = normBarcode(raw);
    var ord = shipState.order;
    if (!code || !ord) return;
    var sku = barcodeIndex.get(code);
    if (!sku || !items.has(sku)){ toast('Штрихкод не найден: ' + code, 'bad'); return; }
    var L = ord.lines.find(function(l){ return l.sku === sku; });
    if (!L){
      if (!ord.manual && !confirm('Этого товара нет в заказе: ' + items.get(sku).name + '. Добавить в отгрузку?')) return;
      L = { sku: sku, need: 0, picked: 0, extra: true };
      ord.lines.push(L);
    }
    L.picked++;
    render();
  }

  function renderShip(){
    els.main.innerHTML = '';
    var wrap = el('div', {class:'col'});
    var ord = shipState.order;
    if (ord) renderShipOrder(wrap, ord); else renderShipStart(wrap);
    wrap.appendChild(renderShipHistory());
    els.main.appendChild(wrap);
    var f = document.getElementById(ord ? 'shipScanInput' : 'shipOrderInput');
    if (f) f.focus();
  }

  function renderShipStart(wrap){
    var card = el('div', {class:'card'});
    card.appendChild(el('h2', {}, ['Отгрузка заказа']));
    var inp = el('input', {type:'text', id:'shipOrderInput', class:'mono big-input', autocomplete:'off', placeholder:'Номер заказа / отправления', value: shipState.filter});
    card.appendChild(inp);
    card.appendChild(el('div', {class:'muted small', style:'margin-top:8px;'}, ['Введите номер или отсканируйте этикетку заказа и нажмите Enter. Заказы берутся из файлов на вкладке «Заказы»; если номера там нет, заказ можно собрать вручную.']));
    wrap.appendChild(card);
    var listCard = el('div', {class:'card'});
    var holder = el('div', {});
    listCard.appendChild(holder);
    wrap.appendChild(listCard);
    renderOpenOrders(holder);
    inp.addEventListener('input', function(){ shipState.filter = this.value; renderOpenOrders(holder); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); openOrderByNumber(inp.value); } });
  }

  function renderOpenOrders(holder){
    holder.innerHTML = '';
    var q = shipState.filter.trim().toLowerCase();

  function shipTotals(){
    var ord = shipState.order, units = 0, lines = [];
    ord.lines.forEach(function(l){ units += l.picked; });
    var svc = tariffMap['fbs_' + shipState.mp];
    if (svc){
      var q = svc.basis === 'piece' ? units : 1;
      lines.push({ name: svc.name, qty: q, amount: q * svc.price });
    }
    ['pack_bag', 'pack_box'].forEach(function(k){
      var qn = shipState.pack[k] || 0;
      if (qn > 0 && tariffMap[k]) lines.push({ name: tariffMap[k].name, qty: qn, amount: qn * tariffMap[k].price });
    });
    return { units: units, lines: lines, total: lines.reduce(function(a, l){ return a + l.amount; }, 0) };
  }

  async function doShip(){
    var ord = shipState.order;
    if (!ord || shipState.busy) return;
    if (!shipState.mp){ toast('Выберите маркетплейс', 'bad'); return; }
    var lines = ord.lines.filter(function(l){ return l.picked > 0; });
    if (!lines.length){ toast('Нет отсканированных товаров', 'bad'); return; }
    var warns = [];
    var incomplete = ord.lines.filter(function(l){ return l.need > 0 && l.picked < l.need; });
    if (incomplete.length) warns.push('Собрано не всё: не хватает по ' + incomplete.length + ' поз.');
    if (ord.lines.some(function(l){ return l.need > 0 && l.picked > l.need; })) warns.push('Отсканировано больше, чем в заказе.');
    var shortLines = lines.filter(function(l){ return ((items.get(l.sku) || {}).stock || 0) < l.picked; });
    if (shortLines.length) warns.push('Остатка не хватает по ' + shortLines.length + ' поз. — остаток станет 0.');
    if (ord.unknown.length) warns.push('Позиции вне номенклатуры не будут списаны: ' + ord.unknown.length);
    if (warns.length && !confirm(warns.join('\n') + '\n\nВсё равно отгрузить?')) return;
    shipState.busy = true;
    try{
      var r = await apiFetch('/api/shipments', { method:'POST', body: JSON.stringify({
        order_no: ord.no, marketplace: shipState.mp,
        lines: lines.map(function(l){ return { sku: l.sku, qty: l.picked }; }),
        packaging: ['pack_bag', 'pack_box'].map(function(k){ return { key: k, qty: shipState.pack[k] || 0 }; })
      }) });
      shippedKeys.add(shipState.mp + '|' + ord.no);
      toast('Заказ ' + ord.no + ' отгружен · начислено ' + fmtMoney(r.total), 'ok');
      shipState.order = null;
      shipState.filter = '';
      await refreshItems(true);
      await loadShipOps();
      render();
    }catch(e){
      if (e && /already_shipped/.test(e.message || '')){ shippedKeys.add(shipState.mp + '|' + ord.no); toast('Этот заказ уже отгружен', 'bad'); }
      else toast('Не удалось отгрузить заказ', 'bad');
    }finally{
      shipState.busy = false;
    }
  }

  var ledger = { y: new Date().getFullYear(), m: new Date().getMonth(), service: '', q: '', limit: 200, seq: 0 };

  function ledgerRange(){
    return { from: new Date(ledger.y, ledger.m, 1).toISOString(), to: new Date(ledger.y, ledger.m + 1, 1).toISOString() };
  }
  function rangeQS(){ var r = ledgerRange(); return 'from=' + encodeURIComponent(r.from) + '&to=' + encodeURIComponent(r.to); }
  function monthLabel(y, m){
    var s = new Date(y, m, 1).toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }).replace(/\s*г\.?$/, '');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function shiftMonth(d){
    var dt = new Date(ledger.y, ledger.m + d, 1);
    ledger.y = dt.getFullYear(); ledger.m = dt.getMonth(); ledger.limit = 200;
    render();
  }

  async function loadLedgerDetail(){
    var mySeq = ++ledger.seq;
    var holder = document.getElementById('ledDetail');
    if (!holder) return;
    var qs = rangeQS() + '&limit=' + ledger.limit;
    if (ledger.service) qs += '&service=' + encodeURIComponent(ledger.service);
    if (ledger.q) qs += '&q=' + encodeURIComponent(ledger.q);
    try{
      var d = await apiFetch('/api/charges?' + qs);
      if (mySeq !== ledger.seq) return;
      holder = document.getElementById('ledDetail');

      var tb = el('tbody');
      d.rows.forEach(function(c){
        var refTxt = c.refType === 'order' ? ('Заказ ' + c.ref) : (c.refType === 'item' ? (c.itemName || c.sku) : '—');
        var act = (c.refType === 'manual' && !c.stornoed && !c.stornoOf)

          el('td', {class:'small', style:'white-space:nowrap;'}, [new Date(c.ts).toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'})]),

    var cUnit = el('input', {type:'text', id:'mcUnit', placeholder:'Единица (шт, паллета, час…)', style:'margin-bottom:8px;'});
    var cPrice = el('input', {type:'number', min:'0', step:'any', id:'mcPrice', placeholder:'Цена за единицу, ₽'});
    custom.appendChild(cName); custom.appendChild(cUnit); custom.appendChild(cPrice);

    var date = el('input', {type:'date', id:'mcDate', style:'margin-top:8px;'});
    function updHint(){
      var q = parseFloat(String(qty.value).replace(',', '.')) || 0;
      if (sel.value === '__custom'){
        var p = parseFloat(String(cPrice.value).replace(',', '.')) || 0;
        hint.textContent = 'Сумма: ' + fmtMoney(q * p);
      } else {
        var t = tariffMap[sel.value];
        hint.textContent = t ? ('Сумма: ' + fmtQty(q) + ' × ' + fmtMoney(t.price) + ' = ' + fmtMoney(q * t.price) + (t.unit === 'куб.м·день' ? ' (объём в куб.м × число дней)' : '')) : '';
      }
    }
    sel.addEventListener('change', function(){ custom.style.display = sel.value === '__custom' ? 'block' : 'none'; updHint(); });
    qty.addEventListener('input', updHint); cPrice.addEventListener('input', updHint);
    var go = el('button', {class:'btn primary', id:'mcGo', style:'width:100%;margin-top:12px;', onclick:async function(){
      var q = parseFloat(String(qty.value).replace(',', '.'));
      if (!(q > 0)){ toast('Укажите количество', 'bad'); return; }
      var body = { qty: q, comment: comment.value.trim() };
      if (sel.value === '__custom'){
        var pr = parseFloat(String(cPrice.value).replace(',', '.'));
        if (!cName.value.trim() || !(pr >= 0)){ toast('Укажите название и цену услуги', 'bad'); return; }
        body.name = cName.value.trim(); body.unit = cUnit.value.trim(); body.unit_price = pr;
      } else {
        body.service_key = sel.value;
      }
      if (date.value) body.ts = new Date(date.value + 'T12:00:00').toISOString();
      try{
        await apiFetch('/api/charges/manual', { method:'POST', body: JSON.stringify(body) });
        toast('Начисление добавлено', 'ok');
        qty.value = ''; comment.value = ''; updHint();
        loadLedgerSummary(); loadLedgerDetail();
      }catch(e){ toast('Не удалось добавить начисление', 'bad'); }
    }}, ['Добавить начисление']);
    box.appendChild(el('label', {}, ['Услуга']));
    box.appendChild(sel); box.appendChild(qty); box.appendChild(hint); box.appendChild(custom);
    box.appendChild(comment);
    box.appendChild(el('label', {style:'display:block;margin-top:8px;'}, ['Дата (если не сегодня)']));
    box.appendChild(date); box.appendChild(go);
    updHint();
  }

  function buildTariffEditor(box){
    box.innerHTML = '';
    box.appendChild(el('div', {class:'muted small', style:'margin-bottom:8px;'}, ['Новая цена действует на операции с этого момента. Уже записанные начисления не пересчитываются.']));
    var table = el('table', {class:'data'});
    table.appendChild(el('thead', {}, [el('tr', {}, ['Услуга', 'Цена, ₽', 'Ед.'].map(function(h){ return el('th', {}, [h]); }))]));
    var tb = el('tbody');
    tariff.forEach(function(t){
      var inp = el('input', {type:'number', min:'0', step:'any', value:String(t.price), class:'mono', 'data-key':t.key, style:'width:84px;'});
      var nameCell = [t.name];
      if (t.note) nameCell.push(el('div', {class:'muted small'}, [t.note]));
      if (t.key.indexOf('fbs_') === 0){
        var bs = el('select', {'data-basis':t.key, style:'margin-top:4px;'});
        bs.appendChild(el('option', {value:'order'}, ['за заказ']));
        bs.appendChild(el('option', {value:'piece'}, ['за каждую штуку']));
        bs.value = t.basis || 'order';
        nameCell.push(bs);
      }
      tb.appendChild(el('tr', {}, [el('td', {}, nameCell), el('td', {}, [inp]), el('td', {class:'muted small'}, [t.unit])]));
    });
    table.appendChild(tb);
    box.appendChild(el('div', {class:'tbl-scroll'}, [table]));
    box.appendChild(el('button', {class:'btn primary', id:'tariffSave', style:'width:100%;margin-top:10px;', onclick:async function(){
      var itemsOut = [];
      var bad = false;
      Array.prototype.forEach.call(box.querySelectorAll('input[data-key]'), function(i){
        var p = parseFloat(String(i.value).replace(',', '.'));
        if (!(p >= 0)){ bad = true; return; }
        var o = { key: i.getAttribute('data-key'), price: p };
        var b = box.querySelector('select[data-basis="' + o.key + '"]');
        if (b) o.basis = b.value;
        itemsOut.push(o);
      });
      if (bad){ toast('Проверьте цены: нужны числа от 0', 'bad'); return; }
      try{
        tariff = await apiFetch('/api/tariff', { method:'PUT', body: JSON.stringify({ items: itemsOut }) });
        tariffMap = {}; tariff.forEach(function(t){ tariffMap[t.key] = t; });
        toast('Тариф сохранён', 'ok');
        buildTariffEditor(box);
        var mb = document.getElementById('ledManual'); if (mb) buildManualForm(mb);
      }catch(e){ toast('Не удалось сохранить тариф', 'bad'); }
    }}, ['Сохранить тариф']));
  }

  async function exportLedger(){
    try{
      var qs = rangeQS();
      var s = await apiFetch('/api/charges/summary?' + qs);
      var d = await apiFetch('/api/charges?' + qs + '&limit=50000');
      var a1 = [['Склад', who ? who.name : ''], ['Период', monthLabel(ledger.y, ledger.m)], [], ['Услуга', 'Кол-во', 'Ед.', 'Сумма, ₽']];
      s.rows.forEach(function(r){ a1.push([r.serviceName, r.qty, r.unit, r.amount]); });
      a1.push([]); a1.push(['ИТОГО', '', '', s.total]);
      var a2 = [['Дата', 'Услуга', 'Маркетплейс', 'Заказ / товар', 'Кол-во', 'Ед.', 'Цена, ₽', 'Сумма, ₽', 'Комментарий']];
      d.rows.slice().reverse().forEach(function(c){
        a2.push([new Date(c.ts).toLocaleString('ru-RU'), c.serviceName, MP_LABEL[c.marketplace] || '',
          c.refType === 'order' ? c.ref : (c.itemName || c.sku || ''), c.qty, c.unit, c.unitPrice, c.amount, c.comment || '']);
      });
      var wb = XLSX.utils.book_new();
      var w1 = XLSX.utils.aoa_to_sheet(a1); w1['!cols'] = [{wch:58}, {wch:12}, {wch:12}, {wch:14}];
      var w2 = XLSX.utils.aoa_to_sheet(a2); w2['!cols'] = [{wch:20}, {wch:50}, {wch:14}, {wch:40}, {wch:9}, {wch:10}, {wch:10}, {wch:12}, {wch:30}];
      XLSX.utils.book_append_sheet(wb, w1, 'Итоги');
      XLSX.utils.book_append_sheet(wb, w2, 'Детализация');
      var out = XLSX.write(wb, { type:'array', bookType:'xlsx' });
      downloadBlob(new Blob([out], { type:'application/octet-stream' }), 'Nachisleniya_' + (who ? who.city : 'sklad') + '_' + ledger.y + '-' + pad2(ledger.m + 1) + '.xlsx');
    }catch(e){ toast('Не удалось сформировать файл', 'bad'); }
  }

  /* ---------------- boot ---------------- */
  render();
  initApp();
})();
</script>
</body>
</html>
